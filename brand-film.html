<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fulmen Works — Brand film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--lime:#B6FF00;--emerald:#00D68F;--bg:#0D1117;--surface:#1A222E;--soft:#C9D1DC;--muted:#A9B4C4;
  --grad:linear-gradient(135deg,#B6FF00,#00D68F);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.page{position:fixed;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 46%,rgba(0,214,143,.07),transparent 70%),var(--bg)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3.2vw,38px);z-index:2;padding:0 5vw;transform-origin:50% 46%;will-change:transform}
#logo{width:min(90vw,1180px);height:auto;overflow:visible;display:block}
.fl{fill:#F2F5F8}.fg{fill:url(#lgt)}
.tag{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:600;font-size:clamp(16px,3vw,38px);color:var(--soft);display:flex;gap:.55em;flex-wrap:wrap;justify-content:center;letter-spacing:.02em;min-height:1.4em}
.tag span{display:inline-block;opacity:0}
.tag .g{background:linear-gradient(90deg,#B6FF00,#00D68F);-webkit-background-clip:text;background-clip:text;color:transparent}
/* start overlay */
.start{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .35s ease;cursor:pointer;border:0;color:inherit;font:inherit}
.start.hide{opacity:0;pointer-events:none}
.play{width:88px;height:88px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,214,143,.35);transition:transform .2s ease}
.start:hover .play{transform:scale(1.06)}
.start:focus-visible{outline:3px solid var(--emerald);outline-offset:-6px}
.play svg{width:34px;height:34px;margin-left:4px}
.start b{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;font-size:22px;letter-spacing:.01em}
.start small{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.start small svg{width:18px;height:18px}
/* controls */
.ctrls{position:absolute;left:0;right:0;bottom:clamp(18px,4vh,44px);z-index:4;display:flex;gap:12px;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s ease}
.ctrls.show{opacity:1;pointer-events:auto}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #262F3D;background:var(--surface);color:#fff;font:600 15px Inter,sans-serif;display:inline-flex;align-items:center;gap:9px;cursor:pointer;transition:background .15s ease}
.btn:hover{background:#262F3D}
.btn:focus-visible{outline:3px solid var(--emerald);outline-offset:2px}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--grad);color:var(--bg);border-color:transparent;box-shadow:0 6px 16px rgba(0,214,143,.35)}
.btn.primary:hover{filter:brightness(1.05)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ───── brand film ───── */
#stage,#fx{transition:opacity .6s ease}#stage.gone,#fx.gone{opacity:0}
.ctrls{z-index:9;gap:10px}.btn[hidden]{display:none}
#film{position:absolute;inset:0;z-index:6;display:grid;place-items:center;opacity:0;pointer-events:none;overflow:hidden}
#film.on{opacity:1}
.fr{position:relative;width:min(100vw,calc(100vh*1.7778));width:min(100vw,calc(100dvh*1.7778));aspect-ratio:16/9;container-type:inline-size;overflow:hidden}
.fi{position:absolute;inset:0;font-size:1cqw;color:#E6EBF2}
.L{position:absolute;opacity:0;will-change:transform,opacity}
/* backdrop */
.bgg{position:absolute;inset:-10%;background:radial-gradient(40em 30em at 30% 35%,rgba(182,255,0,.10),transparent 70%),radial-gradient(50em 40em at 75% 70%,rgba(0,214,143,.13),transparent 70%);opacity:1}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:5em 5em;mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000,transparent)}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(220,255,140,.55),rgba(0,214,143,.12) 40%,transparent 70%);opacity:0;pointer-events:none;mix-blend-mode:screen}
/* scene A: kinetic type */
.kt{left:0;right:0;top:50%;text-align:center;font:800 9.5em/0.95 'Bricolage Grotesque',Inter,sans-serif;letter-spacing:-.02em;color:#F2F5F8;transform:translateY(-50%)}
.kt .w{display:inline-block;opacity:0;will-change:transform,opacity}
.kt em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ksub{left:0;right:0;top:69%;text-align:center;font:600 2.3em Inter,sans-serif;color:#A9B4C4;letter-spacing:.01em}
.bar{left:50%;top:63%;height:.35em;width:24em;margin-left:-12em;border-radius:99px;background:var(--grad);transform-origin:center}
/* scene B: tools */
.shot{left:41%;top:14%;width:55%;aspect-ratio:16/10;border-radius:1.2em;overflow:hidden;background:#0b0f15;border:.1em solid #2a3547;box-shadow:0 3em 7em rgba(0,0,0,.6),0 0 6em rgba(0,214,143,.12);transform-origin:50% 50%}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left top;opacity:0}
.shot .sbar{position:absolute;left:0;right:0;top:0;height:2.2em;background:#161d28;z-index:2;display:flex;gap:.55em;align-items:center;padding:0 1em}
.shot .sbar i{width:.7em;height:.7em;border-radius:50%;background:#3a475b}.shot .sbar i:nth-child(1){background:#ff6b6b}.shot .sbar i:nth-child(2){background:#ffd166}.shot .sbar i:nth-child(3){background:#06d6a0}
.shot .simg{position:absolute;left:0;right:0;top:2.2em;bottom:0}
.tinfo{left:6%;top:31%;width:33%}
.tinfo .ti{width:8.5em;height:8.5em;border-radius:2em;overflow:hidden;box-shadow:0 0 4em rgba(0,214,143,.25)}.tinfo .ti svg{width:100%;height:100%;display:block}
.tinfo .tn{margin-top:1em;font:800 4.2em/1.02 'Bricolage Grotesque',Inter,sans-serif;color:#fff;letter-spacing:-.01em}
.tinfo .td{margin-top:.8em;font:500 1.9em/1.35 Inter,sans-serif;color:#A9B4C4}
.tinfo .num{position:absolute;top:-4.2em;left:0;font:700 1.6em Inter,sans-serif;letter-spacing:.18em;color:#B6FF00}
.tinfo .free{display:inline-block;margin-top:1.1em;padding:.35em .9em;border-radius:99px;font:700 1.35em Inter,sans-serif;letter-spacing:.08em;color:#5CF0B6;background:rgba(0,214,143,.14);box-shadow:inset 0 0 0 .08em rgba(0,214,143,.5)}
.prog{left:6%;right:6%;bottom:6%;height:.25em;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--grad)}
/* scene C: creator */
.ph{left:9%;top:11%;height:78%;aspect-ratio:4/5;border-radius:1.6em;overflow:hidden;box-shadow:0 0 0 .14em rgba(182,255,0,.55),0 3em 7em rgba(0,0,0,.6),0 0 8em rgba(0,214,143,.22)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.05)}
.ph .scan{position:absolute;left:0;right:0;height:18%;background:linear-gradient(to bottom,transparent,rgba(182,255,0,.35),transparent);mix-blend-mode:screen}
.cr{left:50%;top:27%;width:44%}
.cr .eb{font:700 1.7em Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#B6FF00}
.cr .nm{margin-top:.35em;font:800 6.4em/.98 'Bricolage Grotesque',Inter,sans-serif;color:#fff;letter-spacing:-.02em}
.cr .nm .c{display:inline-block;opacity:0}
.cr .aka{margin-top:.6em;font:600 2.3em Inter,sans-serif;color:#C9D1DC}
.cr .q{margin-top:1.4em;font:500 2em/1.45 Inter,sans-serif;color:#A9B4C4;max-width:24em}
.cr .ln{margin-top:1.6em;height:.25em;width:14em;border-radius:99px;background:var(--grad);transform-origin:left}
/* scene D: end card */
.endlogo{left:12%;right:12%;top:30%}.endlogo svg{width:100%;height:auto;display:block;overflow:visible}
.endtag{left:0;right:0;top:63%;text-align:center;font:600 3.2em 'Bricolage Grotesque',Inter,sans-serif;color:#C9D1DC}.endtag b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.endpill{left:50%;top:75%;transform:translateX(-50%);padding:.55em 1.4em;border-radius:99px;font:700 1.8em Inter,sans-serif;color:#0D1117;background:var(--grad);white-space:nowrap}
.fade{position:absolute;inset:0;background:#0D1117;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.ph .scan{display:none}}
</style>
</head>

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const easeOutCubic=x=>1-Math.pow(1-x,3), easeInOutSine=x=>-(Math.cos(Math.PI*x)-1)/2;
const easeOutBack=(x,c=1.70158)=>{const c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }

/* ───────── bubble events (logo units; the single source of truth for sound and picture) ───────── */
const BIG_R=78, ROW_Y=-215, ROW_X=k=>824+(k-2)*305;
function buildEvents(spots){
  const R=rng(77), ev=[];
  ICON_SRC.forEach((li,k)=>{ const cand=spots[li].filter(p=>p.m>=10).sort((a,b)=>a.y-b.y)[0]||spots[li].sort((a,b)=>b.m-a.m)[0];
    ev.push({kind:'big',k,letter:li,t:TL.BIG[k],tf:TL.BIG[k]-TL.FORM,x0:cand.x,y0:cand.y,r0:Math.min(11,cand.m),R:BIG_R,tx:ROW_X(k),ty:ROW_Y,D:TL.TRAVEL,tS:TL.BIG[k]+TL.TRAVEL}); });
  const N=30;
  for(let i=0;i<N;i++){ const li=Math.floor(R()*11), t=1.95+i*(4.8/(N-1))+(R()-0.5)*0.12, r0=6+3*R();
    const sp=spots[li].filter(p=>p.m>=r0); const s=sp.length?sp[Math.floor(R()*sp.length)]:spots[li][0];
    ev.push({kind:'small',letter:li,t,tf:t-0.55,x0:s.x,y0:s.y,r0:Math.min(r0,s.m),R:R()<0.15?22+8*R():7+11*R(),vy:55+40*R(),A:9+7*R(),w:Math.PI*2*(0.45+0.35*R()),ph:Math.PI*2*R(),life:4.6+1.8*R(),pop:R()<0.4,note:5+Math.floor(R()*8)}); }
  return ev.sort((a,b)=>a.t-b.t);
}

/* ───────── AUDIO ───────── */
function makeIR(ctx,sec){ const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<n;i++){ const k=i/n; d[i]=(Math.random()*2-1)*Math.pow(1-k,2.4)*(1-0.3*k); } } return b; }
function noiseBuf(ctx,sec){ const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b; }
function buildBus(ctx,dest){
  const master=ctx.createGain(); master.gain.value=0.95;
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.knee.value=20; comp.ratio.value=3; comp.attack.value=0.01; comp.release.value=0.3;
  master.connect(comp); comp.connect(dest||ctx.destination);
  const dry=ctx.createGain(); dry.connect(master);
  const conv=ctx.createConvolver(); conv.buffer=makeIR(ctx,3.4);
  const wet=ctx.createGain(); wet.gain.value=0.7; conv.connect(wet); wet.connect(master);
  return {master,dry,rev:conv};
}
function scheduleAudio(ctx,bus,T0){
  const at=t=>T0+t, TOT=TL.END+2.4, NB=noiseBuf(ctx,4);
  const out=(node,o={})=>{ const p=ctx.createStereoPanner(); p.pan.value=o.pan||0; node.connect(p); p.connect(bus.dry);
    const rv=o.rev==null?0.3:o.rev; if(rv>0){ const r=ctx.createGain(); r.gain.value=rv; p.connect(r); r.connect(bus.rev); } return p; };
  const noise=(t,dur)=>{ const s=ctx.createBufferSource(); s.buffer=NB; s.loop=true; s.start(t); s.stop(t+dur); return s; };
  const env=(g,t,a,peak,d)=>{ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); };
  const NM={a:1180/1621.2,e:210}, panOfX=x=>clamp((NM.a*(x+OFFX)+NM.e)/1600-0.5,-0.5,0.5)*1.7;

  /* 1 · water bed: warm low air that breathes, plus a faint shimmer on top */
  { const n=noise(at(0),TOT), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.6;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,at(0)); g.gain.linearRampToValueAtTime(0.03,at(1.6)); g.gain.setValueAtTime(0.03,at(TOT-2)); g.gain.linearRampToValueAtTime(0,at(TOT));
    const lfo=ctx.createOscillator(); lfo.frequency.value=0.11; const lg=ctx.createGain(); lg.gain.value=0.011; lfo.connect(lg); lg.connect(g.gain);
    n.connect(lp); lp.connect(g); out(g,{rev:0.25}); lfo.start(at(0)); lfo.stop(at(TOT)); }
  { const n=noise(at(0),TOT), hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5200;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,at(0)); g.gain.linearRampToValueAtTime(0.004,at(2)); g.gain.linearRampToValueAtTime(0,at(TOT));
    n.connect(hp); hp.connect(g); out(g,{rev:0.4}); }

  /* 2 · pad: four slow chords (Dmaj9 → Bm7 → Gmaj9 → Dmaj9 up an octave) */
  const pad=(t,notes,dur,pk)=>{ notes.forEach((f,i)=>{ [-4,4].forEach(dt=>{ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f; o.detune.value=dt;
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1300; const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(pk,t+1.3); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(lp); lp.connect(g); out(g,{pan:(i-2)*0.22,rev:0.6}); o.start(t); o.stop(t+dur+0.1); }); });
    const sub=ctx.createOscillator(); sub.type='sine'; sub.frequency.value=notes[0]/ (notes[0]>140?2:1); const gs=ctx.createGain(); env(gs,t,1.0,0.1,dur-0.9); sub.connect(gs); out(gs,{rev:0.15}); sub.start(t); sub.stop(t+dur+0.1); };
  pad(at(0.5),[146.83,220,329.63,369.99,440],3.6,0.03);
  pad(at(2.9),[123.47,185,220,293.66,369.99],3.4,0.03);
  pad(at(5.0),[98,146.83,185,220,246.94],3.6,0.03);
  pad(at(7.2),[146.83,220,329.63,369.99,440,587.33],TL.END-7.2+2.2,0.034);

  /* 3 · letters surface: a soft rising run of water-drop notes, one per letter */
  const drop=(t,f,pan,vel,rev)=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f; const o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.value=f*2; const g2=ctx.createGain(); g2.gain.value=0.2;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(4200,t); lp.frequency.exponentialRampToValueAtTime(900,t+0.5);
    const g=ctx.createGain(); env(g,t,0.006,0.075*vel,0.9); o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); out(g,{pan,rev:rev==null?0.55:rev}); o.start(t); o2.start(t); o.stop(t+1.2); o2.stop(t+1.2); };
  for(let i=0;i<11;i++){ const lx=[63,155,265,380,545,655,1090,1275,1390,1480,1585][i]; drop(at(TL.L0+i*TL.LSTEP+0.12),PENT[i],panOfX(lx),0.55+0.04*i,0.6); }
  { const t=at(TL.BIRD), n=noise(t,1.2), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.4; bp.frequency.setValueAtTime(2200,t); bp.frequency.exponentialRampToValueAtTime(7000,t+0.9);
    const g=ctx.createGain(); env(g,t,0.35,0.022,0.8); n.connect(bp); bp.connect(g); out(g,{rev:0.6}); }

  /* 4 · bubbles: bloop when one breaks free, a bell for each tool, pops, and a chime when a tool bubble lands */
  const bloop=(t,f,vel,pan,big)=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f*0.6,t); o.frequency.exponentialRampToValueAtTime(f,t+(big?0.12:0.075));
    const g=ctx.createGain(); env(g,t,0.004,0.06*vel,big?0.22:0.14); o.connect(g); out(g,{pan,rev:0.45});
    const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.setValueAtTime(f*1.2,t); o2.frequency.exponentialRampToValueAtTime(f*2,t+0.075); const g2=ctx.createGain(); env(g2,t,0.004,0.02*vel,0.1); o2.connect(g2); out(g2,{pan,rev:0.5});
    o.start(t); o.stop(t+0.5); o2.start(t); o2.stop(t+0.4); };
  const bell=(t,f,vel,pan)=>{ [[1,1],[2.76,0.22],[5.4,0.07]].forEach(([m,a])=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*m; const g=ctx.createGain(); env(g,t,0.005,0.085*vel*a,1.9/m**0.4); o.connect(g); out(g,{pan,rev:0.65}); o.start(t); o.stop(t+2.4); }); };
  const pop=(t,pan,vel)=>{ const n=noise(t,0.08), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=2.2; const g=ctx.createGain(); env(g,t,0.001,0.05*vel,0.03); n.connect(bp); bp.connect(g); out(g,{pan,rev:0.4});
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(700,t); o.frequency.exponentialRampToValueAtTime(260,t+0.05); const g2=ctx.createGain(); env(g2,t,0.002,0.03*vel,0.05); o.connect(g2); out(g2,{pan,rev:0.3}); o.start(t); o.stop(t+0.15); };
  LOGO.events.forEach(ev=>{ const pan=panOfX(ev.x0);
    if(ev.kind==='small'){ bloop(at(ev.t),PENT[ev.note],0.7+0.3*Math.min(1,ev.R/20),pan,false); if(ev.pop) pop(at(ev.t+ev.life),clamp(panOfX(ev.x0)+0.2,-0.9,0.9),0.9); }
    else{ const k=ev.k;
      { const n=noise(at(ev.tf),0.7), hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000; const g=ctx.createGain(); env(g,at(ev.tf),0.4,0.012,0.3); n.connect(hp); hp.connect(g); out(g,{pan,rev:0.4}); }   // fizz while it forms
      bloop(at(ev.t),PENT[BELL[k]]/2,1.5,pan,true); bell(at(ev.t+0.04),PENT[BELL[k]],1,pan);
      { const n=noise(at(ev.t),0.9), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(500,at(ev.t)); lp.frequency.exponentialRampToValueAtTime(1700,at(ev.t+0.6)); const g=ctx.createGain(); env(g,at(ev.t),0.3,0.03,0.6); n.connect(lp); lp.connect(g); out(g,{pan,rev:0.5}); }   // soft lift
      bell(at(ev.tS),PENT[CHIME[k]],0.7,clamp(panOfX(ev.tx)*0.8,-0.8,0.8)); } });

  /* 5 · tagline + last bloom */
  drop(at(TL.TAG1),PENT[8],0,0.9,0.6); drop(at(TL.TAG2),PENT[10],0.1,1.0,0.6);
  [5,7,8,10,11,13].forEach((n,i)=> drop(at(7.28+i*0.13),PENT[n],(i%2?0.35:-0.35),0.55,0.7));
}

/* ───────── VISUALS ───────── */
const $=id=>document.getElementById(id);
const svg=$('logo'), stage=$('stage'), cv=$('fx'), cx=cv.getContext('2d');
const L=[...Array(11).keys()].map(i=>$('L'+i));
const birdFx=$('birdFx'), birdIn=$('birdIn'), w1=$('w1'), w2=$('w2'), shine=$('shine'), t1=$('t1'), t2=$('t2');
let W=0,H=0,dpr=1,G=null,LOGO=null;
const PATHS={};
function initPaths(){ if(PATHS.l) return; PATHS.l=L.map(e=>new Path2D(e.getAttribute('d'))); ['body','w1','w2','spot'].forEach(k=>PATHS[k]=new Path2D($(k).getAttribute('d'))); }
const ICONS=ICON_NAMES.map(n=>{ const im=new Image(); im.src='data:image/svg+xml;utf8,'+encodeURIComponent(ICON_SVG[n]); return im; });
const iconsReady=Promise.all(ICONS.map(im=>(im.decode?im.decode():Promise.resolve()).catch(()=>{})));

/* interior points of every letter (so a bubble can really start INSIDE the glyph); m = how big a bubble fits there */
function computeSpots(){
  initPaths(); const c=document.createElement('canvas').getContext('2d'), dirs=[];
  for(let a=0;a<8;a++) dirs.push([Math.cos(a*Math.PI/4),Math.sin(a*Math.PI/4)]);
  return L.map((e,i)=>{ const b=e.getBBox(), p=PATHS.l[i], pts=[];
    for(let x=b.x+4;x<b.x+b.width-4;x+=4) for(let y=b.y+4;y<b.y+b.height-4;y+=4){
      if(!c.isPointInPath(p,x,y)) continue; let m=0;
      for(let r=2;r<=14;r+=2){ if(dirs.every(d=>c.isPointInPath(p,x+d[0]*r,y+d[1]*r))) m=r; else break; }
      if(m>=4) pts.push({x,y,m}); }
    return pts; });
}
function buildG(m,r){
  const R1=rng(11), bokeh=[]; for(let i=0;i<12;i++) bokeh.push({x:R1(),y:R1(),r:60+R1()*120,sp:0.004+R1()*0.008,c:R1()>.5?'182,255,0':'0,214,143',a:0.025+R1()*0.03,ph:R1()*6});
  const R2=rng(12), plank=[]; for(let i=0;i<60;i++) plank.push({x:R2(),y:R2(),s:0.6+R2()*1.6,sp:0.004+R2()*0.012,ph:R2()*6,a:0.12+R2()*0.25,c:R2()>.6?'182,255,0':'255,255,255'});
  return {m,rect:r,bokeh,plank,cxs:r.left+r.width/2,cys:r.top+r.height*0.5};
}
function layout(){
  dpr=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  if(!LOGO){ const bb=birdIn.getBBox(), k=0.58907, bird={x:731.68+k*(bb.x+bb.width/2), y:k*(bb.y+bb.height/2)};
    const lets=L.map(e=>{ const b=e.getBBox(); return {x:b.x+b.width/2,y:b.y+b.height/2,top:b.y,h:b.height}; });
    const spots=computeSpots(); LOGO={bird,lets,spots,events:buildEvents(spots)}; }
  const ctm=svg.getScreenCTM(); G=buildG({a:ctm.a,d:ctm.d,e:ctm.e,f:ctm.f},svg.getBoundingClientRect());
}

/* ───────── shared state (live page and HD recorder both read these) ───────── */
function letterState(i,t){ const ts=TL.L0+i*TL.LSTEP, u=clamp((t-ts)/TL.LDUR); if(u<=0) return null; const p=easeOutCubic(u);
  return {c:LOGO.lets[i],op:p,dy:14*(1-p),sc:0.96+0.04*p,done:u>=1}; }
function birdPose(t,b){ const u=clamp((t-TL.BIRD)/1.2), p=easeOutCubic(u), hov=Math.sin(Math.PI*2*1.1*t)*3*p;
  return {op:clamp(u*1.6),gx:b.x,gy:b.y-60*(1-p)+hov,rot:Math.sin(Math.PI*2*0.5*t)*2*p,wa:(5+10*(1-p))*Math.sin(Math.PI*2*9*t)}; }
const tagP=(t,t0)=>easeOutCubic(clamp((t-t0)/0.6));

function render(t){
  if(!G) layout();
  for(let i=0;i<11;i++){ const e=L[i], st=letterState(i,t);
    if(!st){ e.setAttribute('opacity',0); e.removeAttribute('transform'); continue; }
    e.setAttribute('opacity',st.op.toFixed(3));
    if(st.done) e.removeAttribute('transform');
    else e.setAttribute('transform',`translate(0 ${st.dy.toFixed(2)}) translate(${st.c.x} ${st.c.y}) scale(${st.sc.toFixed(3)}) translate(${-st.c.x} ${-st.c.y})`); }
  { const b=LOGO.bird, p=birdPose(t,b);
    birdFx.setAttribute('opacity',p.op.toFixed(3));
    birdFx.setAttribute('transform',`translate(${p.gx.toFixed(2)} ${p.gy.toFixed(2)}) rotate(${p.rot.toFixed(2)}) translate(${-b.x} ${-b.y})`);
    w1.setAttribute('transform',`rotate(${(-p.wa).toFixed(2)} 235 255)`); w2.setAttribute('transform',`rotate(${(p.wa*1.2).toFixed(2)} 290 200)`); }
  shine.setAttribute('opacity',0);
  [[t1,TL.TAG1],[t2,TL.TAG2]].forEach(([e,t0])=>{ const p=tagP(t,t0); e.style.opacity=p; e.style.transform=`translateY(${(1-p)*12}px)`; e.style.letterSpacing=`${(0.08*(1-p)).toFixed(3)}em`; });
  stage.style.transform='';
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H); drawFX(cx,W,H,t);
}

/* ───────── bubbles ───────── */
function evPos(ev,t){
  const dt=t-ev.t;
  if(ev.kind==='small'){ return {x:ev.x0+ev.A*Math.min(1,dt/0.8)*Math.sin(ev.w*dt+ev.ph), y:ev.y0-ev.vy*dt, r:ev.r0+(ev.R-ev.r0)*easeOutCubic(clamp(dt/0.9)), sx:1, sy:1}; }
  const u=clamp(dt/ev.D), k=ev.k, wob=Math.sin(Math.PI*2*0.5*dt+k)*16*(1-u), idle=Math.max(0,t-ev.tS), sq=Math.exp(-dt/0.14);
  return {x:ev.x0+(ev.tx-ev.x0)*easeInOutSine(u)+wob+Math.sin(Math.PI*2*(0.21*idle+k*0.37))*4*clamp(idle),
          y:ev.y0+(ev.ty-ev.y0)*easeOutCubic(u)+Math.sin(Math.PI*2*(0.33*idle+k*0.21))*6*clamp(idle),
          r:ev.r0+(ev.R-ev.r0)*easeOutBack(clamp(dt/1.1),1.2), sx:1-0.14*sq, sy:1+0.22*sq};
}
function glassBubble(c,x,y,r,al,sx,sy,icon){
  c.save(); c.translate(x,y); c.scale(sx,sy); c.globalAlpha=al;

  if(icon!=null&&ICONS[icon].complete&&ICONS[icon].naturalWidth){ c.globalAlpha=al*0.96; c.drawImage(ICONS[icon],-r*0.6,-r*0.6,r*1.2,r*1.2); c.globalAlpha=al; }

  c.globalAlpha=al; c.lineCap='round'; c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=Math.max(0.9,r*0.07); c.beginPath(); c.arc(0,0,r*0.78,Math.PI*1.12,Math.PI*1.42); c.stroke();
  c.fillStyle='rgba(255,255,255,.75)'; c.beginPath(); c.arc(r*0.52*Math.cos(Math.PI*1.3),r*0.52*Math.sin(Math.PI*1.3)+r*0.02,Math.max(0.7,r*0.045),0,7); c.fill();
  c.strokeStyle='rgba(182,255,0,.4)'; c.lineWidth=Math.max(0.8,r*0.05); c.beginPath(); c.arc(0,0,r*0.8,Math.PI*0.1,Math.PI*0.38); c.stroke();
  c.restore();
}
function insideBubble(c,ev,t){            // a bubble still trapped in the glyph: dark inclusion with a white glint
  const f=clamp((t-ev.tf)/(ev.t-ev.tf)), fade=1-clamp((t-ev.t)/0.22); if(f<=0||fade<=0) return;
  const r=ev.r0*easeOutCubic(f)*(1+0.05*Math.sin(t*9)), al=fade*(ev.kind==='big'?1:0.8);
  c.save(); c.clip(PATHS.l[ev.letter]); c.globalAlpha=al;
  if(ev.kind==='big'){ c.globalCompositeOperation='lighter'; const g=c.createRadialGradient(ev.x0,ev.y0,0,ev.x0,ev.y0,r*4); g.addColorStop(0,`rgba(182,255,0,${0.35*f})`); g.addColorStop(1,'rgba(182,255,0,0)'); c.fillStyle=g; c.beginPath(); c.arc(ev.x0,ev.y0,r*4,0,7); c.fill(); c.globalCompositeOperation='source-over'; }
  c.fillStyle='rgba(13,17,23,.2)'; c.beginPath(); c.arc(ev.x0,ev.y0,r,0,7); c.fill();
  c.strokeStyle='rgba(13,17,23,.55)'; c.lineWidth=1.6; c.beginPath(); c.arc(ev.x0,ev.y0,r,0,7); c.stroke();
  c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=Math.max(1,r*0.16); c.lineCap='round'; c.beginPath(); c.arc(ev.x0,ev.y0,r*0.62,Math.PI*1.15,Math.PI*1.45); c.stroke();
  const u=clamp((t-ev.t)/0.6); if(u>0&&u<1){ c.globalAlpha=(1-u)*0.5; c.strokeStyle='rgba(0,150,100,1)'; c.lineWidth=1.4; c.beginPath(); c.arc(ev.x0,ev.y0,ev.r0*1.2+u*36,0,7); c.stroke(); }
  c.restore();
}
function drawFX(c,W,H,t){
  const m=G.m, sc=W/1920+0.25;
  // calm atmosphere: soft bokeh, slow plankton, a gently breathing glow behind the logo
  c.save(); c.globalCompositeOperation='lighter';
  G.bokeh.forEach(b=>{ const x=((b.x+Math.sin(t*0.12+b.ph)*0.03)%1)*W, y=(((b.y-b.sp*t)%1+1)%1)*H, r=b.r*sc, g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${b.c},${b.a})`); g.addColorStop(1,`rgba(${b.c},0)`); c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); });
  const br=0.05+0.03*Math.sin(Math.PI*2*t/5.2), bg=c.createRadialGradient(G.cxs,G.cys,0,G.cxs,G.cys,G.rect.width*0.6); bg.addColorStop(0,`rgba(0,214,143,${br*clamp(t/2)})`); bg.addColorStop(1,'rgba(0,214,143,0)'); c.fillStyle=bg; c.fillRect(0,0,W,H);
  c.restore();
  G.plank.forEach(p=>{ const x=(p.x+Math.sin(t*0.3+p.ph)*0.01)*W, y=(((p.y-p.sp*t)%1+1)%1)*H; c.globalAlpha=p.a*(0.6+0.4*Math.sin(t*1.3+p.ph))*clamp(t/1.5); c.fillStyle=`rgb(${p.c})`; c.beginPath(); c.arc(x,y,p.s*sc,0,7); c.fill(); }); c.globalAlpha=1;
  // everything below lives in logo units
  c.save(); c.translate(m.e,m.f); c.scale(m.a,m.d); c.translate(OFFX,0); initPaths();
  const ev=LOGO.events;
  ev.forEach(e=>{ if(t>=e.tf&&t<=e.t+0.3) insideBubble(c,e,t); });
  ev.forEach(e=>{ if(e.kind!=='small'||t<e.t) return; const dt=t-e.t, end=e.life;
    if(dt>end+0.45) return; const p=evPos(e,t);
    if(dt>=end){ if(!e.pop) return; const u=clamp((dt-end)/0.4); if(u>=1) return; c.globalAlpha=(1-u)*0.8; c.strokeStyle='#B6FF00'; c.lineWidth=1.3; c.beginPath(); c.arc(p.x,p.y,e.R*(1+0.9*easeOutCubic(u)),0,7); c.stroke();
      for(let j=0;j<6;j++){ const a=j*Math.PI/3+e.ph, d=e.R*(1+1.6*easeOutCubic(u)); c.fillStyle='rgba(182,255,0,.9)'; c.beginPath(); c.arc(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,1.5*(1-u),0,7); c.fill(); } c.globalAlpha=1; return; }
    const fadeIn=clamp(dt/0.25)*clamp(dt/0.2), fadeOut=e.pop?1:1-clamp((dt-(end-1.4))/1.4);
    glassBubble(c,p.x,p.y,p.r,0.75*fadeIn*fadeOut,p.sx,p.sy,null); });
  ev.forEach(e=>{ if(e.kind!=='big'||t<e.t) return; const p=evPos(e,t), a=clamp((t-e.t)/0.25); glassBubble(c,p.x,p.y,p.r,a,p.sx,p.sy,e.k);
    const la=clamp((t-e.tS-0.2)/0.8); if(la>0){ c.save(); c.globalAlpha=la*0.92; c.fillStyle='#C9D1DC'; c.font='500 30px Inter, system-ui, sans-serif'; c.textAlign='center'; c.textBaseline='middle'; const ln=ICON_LABEL[e.k];
      ln.forEach((s,i)=>c.fillText(s,e.tx,e.ty+e.R+44+i*36+(1-easeOutCubic(la))*8)); c.restore(); } });
  c.restore();
}

const FS=TL.END+0.2, BT=1.6/3, A1=3.2, B1=A1+8, C1=B1+4.8, DUR=C1+3.75;
const TOOLS=[['gxs','GXS Product Uploader','Upload product images in batches. Sorted, checked and saved.'],
 ['pdf','PDF Layer Viewer','See every layer. Box the art. Save a clean image.'],
 ['image','Image Downloader & Zipper','Paste links. Get one neatly sorted ZIP.'],
 ['master','Master Quality Checker','Check PDB data against the Master Sheet, row by row.'],
 ['mapper','Mapper Toolkit','Copy rows, build PSD files, and speed up every view.']];
const SHOT_OF={gxs:0,pdf:1,image:2,master:3,mapper:4};
const film=$('film'), fe=id=>$(id);
let ctx=null,bus=null,T0=0,raf=0,muted=false,fallbackStart=0,started=false,ended=false,cloned=false;
const startEl=$('start');
function nowT(){ if(ctx){ return ctx.currentTime-T0-(ctx.outputLatency||ctx.baseLatency||0); } return (performance.now()-fallbackStart)/1000; }
const cl=v=>v<0?0:v>1?1:v, kk=(t,a,b)=>cl((t-a)/(b-a)), eo=x=>1-Math.pow(1-x,3), eb=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}, eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const S=(el,o,tf)=>{ el.style.opacity=o.toFixed(3); if(tf!=null) el.style.transform=tf; };

/* ── film score: 112.5 BPM, Am – F – C – G, kick + hats + bass + pad + pluck; riser and impacts on the cuts ── */
function filmScore(ctx,bus,t0){
  const out=bus.dry, rv=bus.rev, NB=noiseBuf(ctx,2), at=x=>t0+x;
  const g=(v)=>{ const n=ctx.createGain(); n.gain.value=v; return n; };
  const master=g(0.62); master.connect(out); const send=g(0.25); master.connect(send); send.connect(rv);
  master.gain.setValueAtTime(0.62,at(DUR-1.6)); master.gain.linearRampToValueAtTime(0.0001,at(DUR+0.2));
  function env(node,t,a,pk,d){ node.gain.setValueAtTime(0.0001,t); node.gain.exponentialRampToValueAtTime(pk,t+a); node.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
  function osc(type,f,t,dur,pk,a,dest,f1){ const o=ctx.createOscillator(), e=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.6); env(e,t,a||0.005,pk,dur); o.connect(e); e.connect(dest||master); o.start(t); o.stop(t+dur+0.1); }
  function noise(t,dur,pk,type,f,q,dest,f1){ const s=ctx.createBufferSource(); s.buffer=NB; const fl=ctx.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); if(f1) fl.frequency.exponentialRampToValueAtTime(f1,t+dur); fl.Q.value=q||0.8; const e=ctx.createGain(); env(e,t,dur>0.4?dur*0.85:0.003,pk,dur>0.4?dur*0.15:dur); s.connect(fl); fl.connect(e); e.connect(dest||master); s.start(t); s.stop(t+dur+0.05); }
  const kick=t=>osc('sine',150,t,0.32,0.55,0.003,master,42);
  const hat=(t,v)=>noise(t,0.05,v||0.05,'highpass',7500,0.7);
  const boom=t=>{ osc('sine',70,t,1.6,0.5,0.005,master,32); noise(t,1.2,0.12,'lowpass',900,0.7,rv,120); };
  const CH=[[220,261.63,329.63],[174.61,220,261.63],[130.81,164.81,196,261.63],[196,246.94,293.66]];
  const ROOT=[55,43.65,65.41,49];
  // riser into the film
  noise(at(-1.5),1.5,0.14,'bandpass',300,1.4,master,5200);
  const beats=Math.floor((C1-0.01)/BT);
  for(let b=0;b<Math.round(DUR/BT);b++){
    const t=at(b*BT), bar=Math.floor(b/4), c=CH[bar%4], inEnd=b*BT>=C1;
    if(!inEnd){ kick(t); hat(t+BT/2,0.045); if(b%2) hat(t+BT*0.75,0.025); }
    if(b%4===0){ c.forEach((f,i)=>osc('triangle',f,t,4*BT+0.3,0.03,0.35,master)); }
    if(!inEnd||b%4===0) osc('sawtooth',ROOT[bar%4],t,BT*0.9,inEnd?0.07:0.09,0.01,master);
    if(b*BT>=A1-0.01&&!inEnd){ const arp=[0,1,2,1]; for(let s=0;s<2;s++){ const f=c[arp[(b*2+s)%4]]*2; osc('sine',f,t+s*BT/2,0.28,0.05,0.004,master); } }
  }
  // cuts: whoosh on every tool change, impacts on scene changes
  for(let j=0;j<5;j++) noise(at(A1+j*1.6-0.28),0.42,0.06,'bandpass',600,1.1,master,3600);
  boom(at(0)); boom(at(B1)); boom(at(C1));
  // final shimmer chord
  [440,523.25,659.25,880].forEach((f,i)=>osc('sine',f,at(C1+0.05+i*0.06),2.6,0.035,0.02,master));
}

let curTool=-1;
function setTool(j){ if(j===curTool) return; curTool=j; const t=TOOLS[j];
  fe('tic').innerHTML=ICON_SVG[t[0]]; fe('tn').textContent=t[1]; fe('td').textContent=t[2]; fe('tnum').textContent='0'+(j+1)+' / 05'; }

nm.innerHTML=nm.textContent.split(' ').map(w=>'<span style="white-space:nowrap;display:inline-block">'+[...w].map(ch=>'<span class="c">'+ch+'</span>').join('')+'</span>').join(' '); const nmc=[...nm.querySelectorAll('.c')];
const shotImgs=[...document.querySelectorAll('#shot img')];
function filmAt(F){
  // backdrop
  S(fe('bgg'),kk(F,0,.6),`translate(${Math.sin(F*.35)*2}%,${Math.cos(F*.28)*2}%) scale(${1+.05*Math.sin(F*.2)})`); S(fe('grid'),kk(F,0,.8)*0.9,`translateY(${(F*1.2)%5}em)`);
  // flash on cuts
  const fl=[0,B1,C1].reduce((m,c)=>Math.max(m,F>=c?Math.exp(-(F-c)*5):0),0); fe('flash').style.opacity=(fl*0.9).toFixed(3);
  // A: kinetic type
  const aOut=kk(F,A1-.35,A1);
  S(fe('kt'),1-aOut,`translateY(-50%) scale(${1+aOut*.12})`);
  words.forEach((w,i)=>{ const p=kk(F,.08+i*BT*.5,.08+i*BT*.5+.42); w.style.opacity=p.toFixed(3); w.style.transform=`translateY(${((1-eo(p))*.45).toFixed(3)}em) scale(${(.85+.15*eb(p)).toFixed(3)})`; w.style.filter=`blur(${((1-p)*8).toFixed(1)}px)`; });
  const bp=kk(F,1.2,1.6); S(fe('kbar'),eo(bp)*(1-aOut),`scaleX(${eo(bp)})`);
  const sp=kk(F,1.45,1.95); S(fe('ksub'),eo(sp)*(1-aOut),`translateY(${(1-eo(sp))*1.2}em)`);
  // B: tools
  const inB=F>=A1-.05&&F<B1+.05, bIn=kk(F,A1-.05,A1+.45), bOut=kk(F,B1-.3,B1);
  const j=Math.max(0,Math.min(4,Math.floor((F-A1)/1.6))), u=cl((F-A1-j*1.6)/1.6);
  if(inB) setTool(j);
  const push=1+.035*u;
  S(fe('shot'),inB?eo(bIn)*(1-bOut):0,`perspective(110em) translateX(${((1-eo(bIn))*12-bOut*8).toFixed(2)}%) rotateY(${(-14+eo(bIn)*6).toFixed(2)}deg) rotateX(${(4-2*u).toFixed(2)}deg) scale(${(push*(.92+.08*eo(bIn))).toFixed(4)})`);
  shotImgs.forEach((im,k)=>{ const idx=SHOT_OF[TOOLS[j][0]]; const s0=A1+j*1.6; let o=0;
    if(k===idx) o=j===0?1:kk(F,s0-.08,s0+.22); else if(j>0&&k===SHOT_OF[TOOLS[j-1][0]]) o=1-kk(F,s0-.08,s0+.22);
    im.style.opacity=o.toFixed(3); im.style.transform=`translateX(${((1-o)*(k===idx?3:-3)).toFixed(2)}%) scale(${(1+.03*u).toFixed(4)})`; });
  const ti=kk(F,A1+j*1.6,A1+j*1.6+.38), to=j<4?kk(F,A1+j*1.6+1.42,A1+j*1.6+1.6):bOut;
  S(fe('tinfo'),inB?eo(ti)*(1-to):0,`translateY(${((1-eo(ti))*2.2-to*1.2).toFixed(2)}em)`);
  fe('tic').style.transform=`scale(${(.6+.4*eb(kk(F,A1+j*1.6,A1+j*1.6+.45))).toFixed(3)}) rotate(${((1-eo(ti))*-10).toFixed(2)}deg)`;
  S(fe('prog'),inB?eo(bIn)*(1-bOut):0,''); fe('progi').style.width=(cl((F-A1)/8)*100).toFixed(2)+'%';
  // C: creator
  const cIn=kk(F,B1+.05,B1+.75), cOut=kk(F,C1-.35,C1), inC=F>=B1&&F<C1+.05;
  const ph=fe('ph'); S(ph,inC?(1-cOut):0,`translateX(${((1-eo(cIn))*-4).toFixed(2)}em) scale(${(1-cOut*.04).toFixed(4)})`); ph.style.clipPath=`inset(${((1-eio(cIn))*100).toFixed(2)}% 0 0 0 round 1.6em)`;
  ph.querySelector('img').style.transform=`scale(${(1.1-.1*kk(F,B1,C1)).toFixed(4)})`;
  const sc=kk(F,B1+.2,B1+1.2); fe('scan').style.top=(-20+sc*120).toFixed(1)+'%'; fe('scan').style.opacity=(sc>0&&sc<1?1:0);

  const ln=kk(F,B1+2.2,B1+2.8); const lne=fe('cln'); lne.style.transform=`scaleX(${eo(ln)})`;

  const dIn=kk(F,C1,C1+.7); S(fe('endlogo'),eo(dIn),`translateY(${((1-eo(dIn))*2).toFixed(2)}em) scale(${(.9+.1*eo(dIn)+.02*kk(F,C1,DUR)).toFixed(4)})`); fe('endlogo').style.filter=`blur(${((1-dIn)*10).toFixed(1)}px)`;

function loop(){
  const t=nowT();
  if(t<FS){ render(t); }
  if(t>=FS-.45){ $('stage').classList.add('gone'); $('fx').classList.add('gone'); film.classList.add('on'); }
  if(t>=FS-.45) filmAt(Math.max(0,t-FS));
  if(t>=FS+DUR){ return finish(); }
  raf=requestAnimationFrame(loop);
}
function finish(){
  if(ended) return; ended=true; filmAt(DUR); $('replay').hidden=false;
  if(window.parent!==window) setTimeout(()=>parent.postMessage({type:'fw-tutorial-end'},'*'),1400); else $('replay').focus();
}

function fwTapSound(play){ if(!/[?&]autoplay=1/.test(location.search)||document.getElementById('fwtap')) return;
  const b=document.createElement('button'); b.id='fwtap'; b.type='button'; b.textContent='🔊 Tap for sound';
  b.style.cssText='position:fixed;z-index:99;top:12px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:999px;border:1px solid rgba(182,255,0,.5);background:rgba(13,17,23,.88);color:#B6FF00;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent';
  b.addEventListener('click',function(){ b.remove(); play(); }); document.body.appendChild(b); }
function fwPrime(){ try{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; fwSS().speak(u); } }catch(_){}
  try{ if(typeof REC!=='undefined'){ window.__fwPrimed=window.__fwPrimed||{}; for(const k in REC){ const a=window.__fwPrimed[k]||new Audio(REC[k].src); window.__fwPrimed[k]=a; const p=a.play(); if(p) p.then(function(){ a.pause(); a.currentTime=0; }).catch(function(){}); } } }catch(_){} }
async function play(){ fwPrime();
  started=true; ended=false; cloned=false; fe('endlogo').innerHTML=''; curTool=-1; cancelAnimationFrame(raf);
  startEl.classList.add('hide'); $('replay').hidden=true; film.classList.remove('on'); $('stage').classList.remove('gone'); $('fx').classList.remove('gone');
  try{ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; ctx=fwCtx(AC); bus=buildBus(ctx); }
    bus.master.gain.cancelScheduledValues(ctx.currentTime); bus.master.gain.value=muted?0:0.9;
    await Promise.race([ctx.resume(),new Promise(function(r){setTimeout(r,350)})]); if(ctx.state!=='running') throw 0; T0=ctx.currentTime+0.15; scheduleAudio(ctx,bus,T0); filmScore(ctx,bus,T0+FS);
  }catch(e){ ctx=null; bus=null; fallbackStart=performance.now()+150; try{fwTapSound(play);}catch(_){} }
  render(-1); filmAt(0); loop();
}

window.fwFilmAt=F=>{ cancelAnimationFrame(raf); startEl.classList.add('hide'); $('stage').classList.add('gone'); $('fx').classList.add('gone'); film.classList.add('on'); filmAt(F); };
window.fwDur=FS+DUR;
window.fwAudio=async()=>{ const sr=22050, oc=new OfflineAudioContext(2,Math.ceil(sr*(FS+DUR+1.5)),sr); const b=buildBus(oc); b.master.gain.value=0.9; scheduleAudio(oc,b,0); filmScore(oc,b,FS); const buf=await oc.startRendering(); const a=buf.getChannelData(0); const seg=[]; const n=Math.floor(sr*1); for(let i=0;i<a.length;i+=n){ let pk=0,ss=0; for(let k=i;k<Math.min(a.length,i+n);k++){ const v=Math.abs(a[k]); if(v>pk)pk=v; ss+=v*v; } seg.push([+(pk.toFixed(2)),+(Math.sqrt(ss/n).toFixed(3))]); } return seg; };
layout(); render(-1);
if(/[?&]autoplay=1/.test(location.search)){ startEl.classList.add('hide'); (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(play,150)); }

})();
</script>
