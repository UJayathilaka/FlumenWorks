<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapper Toolkit — Tutorial · Fulmen Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--lime:#B6FF00;--emerald:#00D68F;--bg:#0D1117;--surface:#1A222E;--soft:#C9D1DC;--muted:#A9B4C4;
  --grad:linear-gradient(135deg,#B6FF00,#00D68F);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.page{position:fixed;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 46%,rgba(0,214,143,.07),transparent 70%),var(--bg)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3.2vw,38px);z-index:2;padding:0 5vw;transform-origin:50% 46%;will-change:transform}
#logo{width:min(90vw,1180px);height:auto;overflow:visible;display:block}
.fl{fill:#F2F5F8}.fg{fill:url(#lgt)}
.tag{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:600;font-size:clamp(16px,3vw,38px);color:var(--soft);display:flex;gap:.55em;flex-wrap:wrap;justify-content:center;letter-spacing:.02em;min-height:1.4em}
.tag span{display:inline-block;opacity:0}
.tag .g{background:linear-gradient(90deg,#B6FF00,#00D68F);-webkit-background-clip:text;background-clip:text;color:transparent}
/* start overlay */
.start{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .35s ease;cursor:pointer;border:0;color:inherit;font:inherit}
.start.hide{opacity:0;pointer-events:none}
.play{width:88px;height:88px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,214,143,.35);transition:transform .2s ease}
.start:hover .play{transform:scale(1.06)}
.start:focus-visible{outline:3px solid var(--emerald);outline-offset:-6px}
.play svg{width:34px;height:34px;margin-left:4px}
.start b{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;font-size:22px;letter-spacing:.01em}
.start small{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.start small svg{width:18px;height:18px}
/* controls */
.ctrls{position:absolute;left:0;right:0;bottom:clamp(18px,4vh,44px);z-index:4;display:flex;gap:12px;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s ease}
.ctrls.show{opacity:1;pointer-events:auto}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #262F3D;background:var(--surface);color:#fff;font:600 15px Inter,sans-serif;display:inline-flex;align-items:center;gap:9px;cursor:pointer;transition:background .15s ease}
.btn:hover{background:#262F3D}
.btn:focus-visible{outline:3px solid var(--emerald);outline-offset:2px}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--grad);color:var(--bg);border-color:transparent;box-shadow:0 6px 16px rgba(0,214,143,.35)}
.btn.primary:hover{filter:brightness(1.05)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ───── tutorial layer ───── */
#stage,#fx{transition:opacity .7s ease}#stage.gone,#fx.gone{opacity:0}
.ctrls{z-index:9;gap:10px;align-items:center}
.btn[hidden]{display:none}.btn.on{border-color:var(--emerald);box-shadow:0 0 0 1px var(--emerald) inset}
.vsel select{min-height:44px;max-width:210px;border-radius:10px;border:1px solid #262F3D;background:var(--surface);color:#fff;font:500 14px Inter,sans-serif;padding:0 10px}
.vsel select:focus-visible{outline:3px solid var(--emerald);outline-offset:2px}
.btn.pulse{animation:pls 1.6s ease-in-out infinite}@keyframes pls{50%{box-shadow:0 0 0 6px rgba(182,255,0,.25)}}
#tut{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,18px);padding:10px 12px 96px;opacity:0;pointer-events:none;transition:opacity .7s ease}
#tut.on{opacity:1}
#tut::before{content:"";position:absolute;inset:0;background:radial-gradient(45em 32em at 18% 28%,rgba(182,255,0,.05),transparent 70%),radial-gradient(55em 42em at 82% 72%,rgba(0,214,143,.08),transparent 70%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(2%,-2%) scale(1.06)}}
.frame{position:relative;width:min(96vw,calc((100vh - 200px)*1.7778));width:min(96vw,calc((100dvh - 200px)*1.7778));aspect-ratio:16/9;container-type:inline-size}
.fin{position:relative;width:100%;height:100%;font-size:1cqw;color:var(--soft);transition:opacity .6s}.fin.fade{opacity:0}
#cap{position:relative;z-index:2;max-width:min(96vw,1100px);min-height:2.7em;padding:.35em .9em;border-radius:12px;background:rgba(13,17,23,.55);text-align:center;font:600 clamp(14px,1.9vw,23px)/1.35 'Bricolage Grotesque',Inter,sans-serif;color:#fff;text-wrap:balance;opacity:0;transition:opacity .25s}
#cap.show{opacity:1}#cap.off{display:none}
.stepb{position:absolute;left:3em;top:1.7em;display:flex;align-items:center;gap:.8em;font:700 2.1em 'Bricolage Grotesque',Inter,sans-serif;color:#fff;opacity:0;transform:translateY(.7em);transition:opacity .4s,transform .5s cubic-bezier(.34,1.56,.64,1)}
.stepb.on{opacity:1;transform:none}
.stepb .n{display:grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--grad);color:#0D1117;font-size:.85em}
.win{position:absolute;left:3em;top:7em;width:64em;height:44em;border-radius:1.4em;background:#111823;border:.1em solid #262F3D;overflow:hidden;box-shadow:0 2em 5em rgba(0,0,0,.45);opacity:0;transform:translateY(2em) scale(.97);transition:opacity .7s,transform .8s cubic-bezier(.16,1,.3,1)}
.pageon .win{opacity:1;transform:none}
.win .bar{height:3.4em;display:flex;align-items:center;gap:.7em;padding:0 1.3em;background:#1A222E}
.win .bar i{width:.9em;height:.9em;border-radius:50%;background:#3a475b}.win .bar i:first-child{background:#ff6b6b}.win .bar i:nth-child(2){background:#ffd166}.win .bar i:nth-child(3){background:#06d6a0}
.win .url{margin-left:1em;flex:1;height:2em;border-radius:99px;background:#0D1117;display:flex;align-items:center;padding:0 1.1em;font:500 1em Inter,sans-serif;color:#8D99AB}
.pg{display:grid;grid-template-columns:11em 1fr;height:calc(100% - 3.4em)}
.nav{padding:1.5em;display:flex;flex-direction:column;gap:1.1em;border-right:.1em solid #232c3a}
.sk{height:1em;border-radius:.5em;background:#222C3B}
.mn{padding:1.6em;display:flex;flex-direction:column;gap:1.2em}
.rw{display:flex;gap:1.1em;align-items:center}.th{width:4.4em;height:3.2em;border-radius:.6em;background:#1c2635;flex:none}.rw .sk{flex:1}
.tog{position:absolute;right:0;top:24em;width:3.4em;height:6em;border:0;border-radius:1.2em 0 0 1.2em;background:#1A222E;border:.1em solid #34435a;border-right:0;display:grid;place-items:center;color:#B6FF00;transition:opacity .3s,transform .3s;animation:nudge 1.6s ease-in-out infinite}
.tog svg{width:1.8em;height:1.8em}.tog.hide{opacity:0;transform:translateX(100%);animation:none}
@keyframes nudge{50%{transform:translateX(-.5em)}}
.gp{position:absolute;right:2.2em;top:3.9em;width:27em;height:42.6em;font-size:1.15em;display:flex;flex-direction:column;background:#0D1117;border:.12em solid rgba(0,214,143,.5);border-radius:1.5em;box-shadow:0 2em 6em rgba(0,0,0,.55),0 0 5em rgba(0,214,143,.12);transform:translateX(125%);opacity:0;transition:transform .75s cubic-bezier(.16,1,.3,1),opacity .4s}
.gp.open{transform:none;opacity:1}
.gh{display:flex;align-items:center;gap:.8em;padding:1.1em 1.3em;border-bottom:.1em solid #232c3a;font:700 1.45em 'Bricolage Grotesque',Inter,sans-serif;color:#fff}
.gh .dot{width:.7em;height:.7em;border-radius:50%;background:var(--grad)}
.badge{margin-left:auto;font:600 .6em Inter,sans-serif;padding:.2em .8em;border-radius:99px;background:#1A222E;color:var(--lime);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:.45em;padding:.9em 1.1em 0}
.tabs span{flex:1;text-align:center;padding:.6em .2em;border-radius:.7em;font:600 .92em Inter,sans-serif;color:#A9B4C4;background:#151C27;border:.1em solid #232c3a;transition:all .3s}
.tabs span.on{color:#0D1117;background:var(--grad);border-color:transparent}
.tabs span.hl{box-shadow:0 0 0 .22em rgba(182,255,0,.6)}
.gbody{position:relative;flex:1;min-height:0}
.pane{position:absolute;inset:1em 1.1em;opacity:0;pointer-events:none;transform:translateY(.8em);transition:opacity .35s,transform .35s;display:flex;flex-direction:column;gap:.7em}
.gp[data-pane=drop] .p-drop,.gp[data-pane=sort] .p-sort,.gp[data-pane=steps] .p-steps{opacity:1;transform:none}
.dz{border:.14em dashed #2d3a4d;border-radius:1em;padding:1.1em;text-align:center;color:#A9B4C4;font:500 .95em Inter,sans-serif;transition:border-color .3s,background .3s}
.dz.hot{border-color:var(--emerald);background:rgba(0,214,143,.08)}
.queue{display:flex;flex-direction:column;gap:.5em}
.qr{display:flex;align-items:center;gap:.7em;padding:.6em .8em;background:#151C27;border:.1em solid #232c3a;border-radius:.8em;font:500 .92em Inter,sans-serif;color:#E6EBF2;animation:rowin .5s cubic-bezier(.34,1.56,.64,1);transition:all .5s}
@keyframes rowin{from{opacity:0;transform:translateY(-.6em) scale(.96)}}
.sw{flex:none;width:1em;height:1em;border-radius:50%;border:.1em solid rgba(255,255,255,.4);transition:box-shadow .3s}
.glow .sw{box-shadow:0 0 0 .25em rgba(182,255,0,.55),0 0 1em rgba(182,255,0,.5)}
.st{margin-left:auto;font-size:.88em;color:#8D99AB;display:flex;align-items:center;gap:.4em}
.qr.busy{border-color:var(--emerald)}.qr.busy .st::before{content:"";width:.9em;height:.9em;border-radius:50%;border:.15em solid #2d3a4d;border-top-color:var(--lime);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.qr.ok .st{color:var(--lime)}.qr.ok .st::before{content:"";width:.5em;height:.9em;border:solid var(--lime);border-width:0 .17em .17em 0;transform:rotate(45deg) translate(-.1em,-.1em)}
.ol{padding:.8em 1em;border-radius:.8em;background:#0a0e14;border:.1em solid #232c3a;font:500 .85em/1.7 ui-monospace,Consolas,monospace;color:#C9D1DC;min-height:5.9em}
.ol div{display:flex;gap:2em;opacity:0;transform:translateX(-.5em);transition:all .35s}.ol div.show{opacity:1;transform:none}.ol span{color:var(--lime)}
.btn2{align-self:flex-start;padding:.65em 1.2em;border-radius:.8em;background:var(--grad);color:#0D1117;font:700 .95em Inter,sans-serif;transition:transform .15s}.btn2.press{transform:scale(.94)}
.stg .qr{padding:.45em .8em}.stg .qr.go{transform:translateX(120%);opacity:0}.stg .qr.un{border-color:#ffb86b}.stg .qr.un .st{color:#ffb86b}
.toast{position:absolute;left:1.1em;right:1.1em;bottom:.6em;padding:.6em .9em;border-radius:.8em;background:rgba(0,214,143,.15);border:.1em solid rgba(0,214,143,.5);color:#fff;font:600 .9em Inter,sans-serif;opacity:0;transform:translateY(.6em);transition:all .4s}.toast.on{opacity:1;transform:none}
.tgl{display:flex;align-items:center;gap:.8em;padding:.6em .8em;background:#151C27;border:.1em solid #232c3a;border-radius:.8em;font:500 .95em Inter,sans-serif;color:#E6EBF2;transition:all .3s}
.tgl.hl{border-color:var(--lime);background:#1b2430;transform:translateX(.3em)}
.sw2{margin-left:auto;width:2.4em;height:1.3em;border-radius:99px;background:#2a3547;position:relative;transition:background .3s}.sw2::after{content:"";position:absolute;top:.15em;left:.15em;width:1em;height:1em;border-radius:50%;background:#fff;transition:transform .3s}
.sw2.on{background:var(--emerald)}.sw2.on::after{transform:translateX(1.1em)}
.gf{padding:.9em 1.1em 1.1em;border-top:.1em solid #232c3a;display:flex;flex-direction:column;gap:.6em}
.gs{font:500 .88em Inter,sans-serif;color:#C9D1DC;min-height:1.3em}
.pb{height:.45em;border-radius:99px;background:#1A222E;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--grad);transition:width .5s}
.gstart,.gstop{padding:.75em;text-align:center;border-radius:.9em;font:700 1.02em Inter,sans-serif;transition:transform .15s,box-shadow .3s}
.gstart{background:var(--grad);color:#0D1117}.gstart.press{transform:scale(.96)}
.gstop{display:none;background:#2a1d22;color:#ff8f8f;border:.1em solid #6b2f38}.gstop.hl{box-shadow:0 0 0 .25em rgba(255,143,143,.4)}
.gp[data-pane=sort] .gstart{display:none}
.opt{display:flex;align-items:center;gap:.6em;font:500 .8em Inter,sans-serif;color:#A9B4C4}
.cb{width:1.25em;height:1.25em;border-radius:.3em;border:.12em solid #3a475b;display:grid;place-items:center;transition:all .3s;flex:none}
.cb.on{background:var(--grad);border-color:transparent}.cb.on::after{content:"";width:.3em;height:.6em;border:solid #0D1117;border-width:0 .16em .16em 0;transform:rotate(45deg) translate(-.05em,-.05em)}
.opt.hl{color:#fff}.opt.hl .cb{box-shadow:0 0 0 .22em rgba(182,255,0,.55)}
.call{position:absolute;left:5em;bottom:4.2em;padding:.7em 1.3em;border-radius:99px;background:rgba(13,17,23,.85);border:.1em solid rgba(182,255,0,.5);color:#fff;font:700 1.9em 'Bricolage Grotesque',Inter,sans-serif;opacity:0;transform:translateY(.8em);transition:all .4s}.call.on{opacity:1;transform:none}
#fly{position:absolute;inset:0;pointer-events:none;z-index:15}
.fchip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:.6em;padding:.5em .9em;background:#1d2736;border:.1em solid #34435a;border-radius:.7em;font:500 1.05em Inter,sans-serif;color:#fff;white-space:nowrap;will-change:transform}
.ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8em;opacity:0;pointer-events:none;transition:opacity .6s}.ov.on{opacity:1}
.ov .ic{width:13em;height:13em;border-radius:3em;overflow:hidden;transform:scale(.4);opacity:0;transition:all .7s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 6em rgba(0,214,143,.3)}.ov .ic svg{width:100%;height:100%;display:block}
.ov.pop .ic{transform:none;opacity:1}
.ov h2{font:800 5.4em/1 'Bricolage Grotesque',Inter,sans-serif;color:#fff;letter-spacing:-.01em;opacity:0;transform:translateY(.4em);transition:all .6s .15s}.ov.pop h2{opacity:1;transform:none}
.ov h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips2{display:flex;gap:1.2em}.chips2 span{padding:.55em 1.3em;border-radius:99px;border:.1em solid #34435a;background:#151C27;font:600 1.7em Inter,sans-serif;color:#C9D1DC;opacity:0;transform:translateY(.8em) scale(.9);transition:all .5s cubic-bezier(.34,1.56,.64,1)}.chips2 span.on{opacity:1;transform:none}
#cur{position:absolute;left:0;top:0;width:2.6em;height:2.6em;z-index:20;opacity:0;pointer-events:none;transform:translate(60em,70em);transition:transform .8s cubic-bezier(.45,0,.2,1),opacity .3s}
#cur svg{width:100%;height:100%;filter:drop-shadow(0 .15em .3em rgba(0,0,0,.6))}
#cur .rip{position:absolute;left:-.2em;top:-.2em;width:2.2em;height:2.2em;border-radius:50%;border:.2em solid var(--lime);opacity:0}
#cur.click .rip{animation:rip .55s ease-out}@keyframes rip{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){#tut::before,.tog{animation:none}}

.ctrls{flex-wrap:wrap;justify-content:center;padding:0 10px;bottom:clamp(8px,2.2vh,28px);row-gap:8px}
@media (max-width:560px){.ctrls{gap:8px}.ctrls .btn{padding:0 12px;font-size:13px;min-height:40px}.vsel select{min-height:40px;max-width:160px;font-size:13px}#muteLbl{display:none}#tut{padding-bottom:110px}}
/* ───── screenshot tutorial layer ───── */
.bw{position:absolute;left:10em;top:3.4em;width:80em;border-radius:1.1em;overflow:hidden;background:#0b0f15;border:.1em solid #2a3547;box-shadow:0 2.4em 6em rgba(0,0,0,.55);opacity:0;transform:translateY(1.6em) scale(.97);transition:opacity .7s,transform .9s cubic-bezier(.16,1,.3,1)}
.pageon .bw{opacity:1;transform:none}
.bwbar{height:2.6em;display:flex;align-items:center;gap:.6em;padding:0 1.1em;background:#161d28;border-bottom:.1em solid #222b38}
.bwbar>i{width:.8em;height:.8em;border-radius:50%;background:#3a475b;flex:none}.bwbar>i:nth-child(1){background:#ff6b6b}.bwbar>i:nth-child(2){background:#ffd166}.bwbar>i:nth-child(3){background:#06d6a0}
.bwtab{margin-left:.8em;display:flex;align-items:center;gap:.5em;height:2.1em;padding:0 1em;border-radius:.6em .6em 0 0;background:#0b0f15;color:#E6EBF2;font:600 1.05em Inter,sans-serif;white-space:nowrap}
.bwtab .ti{width:1.3em;height:1.3em;border-radius:.3em;overflow:hidden}.bwtab .ti svg{width:100%;height:100%;display:block}
.bwurl{flex:1;min-width:0;height:2em;margin-left:.6em;border-radius:99px;background:#0b0f15;display:flex;align-items:center;padding:0 1em;font:500 .95em Inter,sans-serif;color:#7d8899;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#0b0f15}
.cam{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.cam img{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .45s ease}
.ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spot{position:absolute;left:0;top:0;width:0;height:0;border-radius:.7em;box-shadow:0 0 0 .18em rgba(230,235,242,.95),0 0 1.6em rgba(182,255,0,.35),0 0 0 200em rgba(5,8,12,.42);opacity:0;transition:opacity .35s}
.spot.on{opacity:1}
#cur2{position:absolute;left:0;top:0;width:2.6em;height:2.6em;opacity:0;transition:opacity .3s;will-change:transform}
#cur2 svg{width:100%;height:100%;filter:drop-shadow(0 .15em .35em rgba(0,0,0,.6))}
#cur2 .rip{position:absolute;left:-.25em;top:-.25em;width:2.2em;height:2.2em;border-radius:50%;border:.22em solid #B6FF00;opacity:0}
#cur2.click .rip{animation:rip .55s ease-out}
.kb{position:absolute;left:50%;bottom:6%;display:flex;align-items:center;gap:.7em;padding:.7em 1.2em;border-radius:1em;background:rgba(13,17,23,.88);border:.1em solid #34435a;color:#E6EBF2;font:600 1.6em Inter,sans-serif;transform:translate(-50%,1em) scale(.9);opacity:0;transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1em 2.4em rgba(0,0,0,.5)}
.kb.on{opacity:1;transform:translate(-50%,0)}
.kb kbd{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;padding:0 .5em;border-radius:.4em;background:#E6EBF2;color:#0D1117;font:700 .95em Inter,sans-serif;box-shadow:0 .18em 0 #8d99ab}
.kb kbd.press{animation:kp .35s ease}@keyframes kp{40%{transform:translateY(.15em);box-shadow:0 .03em 0 #8d99ab}}
.tagx{position:absolute;padding:.45em .9em;border-radius:.7em;background:#E6EBF2;color:#0D1117;font:700 1.35em Inter,sans-serif;white-space:nowrap;opacity:0;transform:translateY(.4em);transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 .6em 1.6em rgba(0,0,0,.45)}
.tagx.on{opacity:1;transform:none}
.stepb{left:5.75em;top:.2em;font-size:1.75em}
@media (max-width:560px){.kb{font-size:2.2em}.tagx{font-size:1.9em}}
</style>
</head>
<body>
<div class="page" id="page">
  <canvas id="fx"></canvas>
  <div class="stage" id="stage">
    <svg id="logo" viewBox="0 0 1621.2 248" role="img" aria-label="Fulmen Works" xmlns="http://www.w3.org/2000/svg">
      <defs>

  const pad=(t,notes,dur,pk)=>{ notes.forEach((f,i)=>{ [-4,4].forEach(dt=>{ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f; o.detune.value=dt;
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1300; const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(pk,t+1.3); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(lp); lp.connect(g); out(g,{pan:(i-2)*0.22,rev:0.6}); o.start(t); o.stop(t+dur+0.1); }); });
    const sub=ctx.createOscillator(); sub.type='sine'; sub.frequency.value=notes[0]/ (notes[0]>140?2:1); const gs=ctx.createGain(); env(gs,t,1.0,0.1,dur-0.9); sub.connect(gs); out(gs,{rev:0.15}); sub.start(t); sub.stop(t+dur+0.1); };
  pad(at(0.5),[146.83,220,329.63,369.99,440],3.6,0.03);
  pad(at(2.9),[123.47,185,220,293.66,369.99],3.4,0.03);
  pad(at(5.0),[98,146.83,185,220,246.94],3.6,0.03);
  pad(at(7.2),[146.83,220,329.63,369.99,440,587.33],TL.END-7.2+2.2,0.034);

  /* 3 · letters surface: a soft rising run of water-drop notes, one per letter */
  const drop=(t,f,pan,vel,rev)=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f; const o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.value=f*2; const g2=ctx.createGain(); g2.gain.value=0.2;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(4200,t); lp.frequency.exponentialRampToValueAtTime(900,t+0.5);
    const g=ctx.createGain(); env(g,t,0.006,0.075*vel,0.9); o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); out(g,{pan,rev:rev==null?0.55:rev}); o.start(t); o2.start(t); o.stop(t+1.2); o2.stop(t+1.2); };
  for(let i=0;i<11;i++){ const lx=[63,155,265,380,545,655,1090,1275,1390,1480,1585][i]; drop(at(TL.L0+i*TL.LSTEP+0.12),PENT[i],panOfX(lx),0.55+0.04*i,0.6); }
  { const t=at(TL.BIRD), n=noise(t,1.2), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.4; bp.frequency.setValueAtTime(2200,t); bp.frequency.exponentialRampToValueAtTime(7000,t+0.9);
    const g=ctx.createGain(); env(g,t,0.35,0.022,0.8); n.connect(bp); bp.connect(g); out(g,{rev:0.6}); }

  /* 4 · bubbles: bloop when one breaks free, a bell for each tool, pops, and a chime when a tool bubble lands */
  const bloop=(t,f,vel,pan,big)=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f*0.6,t); o.frequency.exponentialRampToValueAtTime(f,t+(big?0.12:0.075));
    const g=ctx.createGain(); env(g,t,0.004,0.06*vel,big?0.22:0.14); o.connect(g); out(g,{pan,rev:0.45});
    const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.setValueAtTime(f*1.2,t); o2.frequency.exponentialRampToValueAtTime(f*2,t+0.075); const g2=ctx.createGain(); env(g2,t,0.004,0.02*vel,0.1); o2.connect(g2); out(g2,{pan,rev:0.5});
    o.start(t); o.stop(t+0.5); o2.start(t); o2.stop(t+0.4); };
  const bell=(t,f,vel,pan)=>{ [[1,1],[2.76,0.22],[5.4,0.07]].forEach(([m,a])=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*m; const g=ctx.createGain(); env(g,t,0.005,0.085*vel*a,1.9/m**0.4); o.connect(g); out(g,{pan,rev:0.65}); o.start(t); o.stop(t+2.4); }); };
  const pop=(t,pan,vel)=>{ const n=noise(t,0.08), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=2.2; const g=ctx.createGain(); env(g,t,0.001,0.05*vel,0.03); n.connect(bp); bp.connect(g); out(g,{pan,rev:0.4});
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(700,t); o.frequency.exponentialRampToValueAtTime(260,t+0.05); const g2=ctx.createGain(); env(g2,t,0.002,0.03*vel,0.05); o.connect(g2); out(g2,{pan,rev:0.3}); o.start(t); o.stop(t+0.15); };
  LOGO.events.forEach(ev=>{ const pan=panOfX(ev.x0);
    if(ev.kind==='small'){ bloop(at(ev.t),PENT[ev.note],0.7+0.3*Math.min(1,ev.R/20),pan,false); if(ev.pop) pop(at(ev.t+ev.life),clamp(panOfX(ev.x0)+0.2,-0.9,0.9),0.9); }
    else{ const k=ev.k;
      { const n=noise(at(ev.tf),0.7), hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000; const g=ctx.createGain(); env(g,at(ev.tf),0.4,0.012,0.3); n.connect(hp); hp.connect(g); out(g,{pan,rev:0.4}); }   // fizz while it forms
      bloop(at(ev.t),PENT[BELL[k]]/2,1.5,pan,true); bell(at(ev.t+0.04),PENT[BELL[k]],1,pan);
      { const n=noise(at(ev.t),0.9), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(500,at(ev.t)); lp.frequency.exponentialRampToValueAtTime(1700,at(ev.t+0.6)); const g=ctx.createGain(); env(g,at(ev.t),0.3,0.03,0.6); n.connect(lp); lp.connect(g); out(g,{pan,rev:0.5}); }   // soft lift
      bell(at(ev.tS),PENT[CHIME[k]],0.7,clamp(panOfX(ev.tx)*0.8,-0.8,0.8)); } });

  /* 5 · tagline + last bloom */
  drop(at(TL.TAG1),PENT[8],0,0.9,0.6); drop(at(TL.TAG2),PENT[10],0.1,1.0,0.6);
  [5,7,8,10,11,13].forEach((n,i)=> drop(at(7.28+i*0.13),PENT[n],(i%2?0.35:-0.35),0.55,0.7));
}

/* ───────── VISUALS ───────── */
const $=id=>document.getElementById(id);
const svg=$('logo'), stage=$('stage'), cv=$('fx'), cx=cv.getContext('2d');
const L=[...Array(11).keys()].map(i=>$('L'+i));
const birdFx=$('birdFx'), birdIn=$('birdIn'), w1=$('w1'), w2=$('w2'), shine=$('shine'), t1=$('t1'), t2=$('t2');
let W=0,H=0,dpr=1,G=null,LOGO=null;
const PATHS={};
function initPaths(){ if(PATHS.l) return; PATHS.l=L.map(e=>new Path2D(e.getAttribute('d'))); ['body','w1','w2','spot'].forEach(k=>PATHS[k]=new Path2D($(k).getAttribute('d'))); }
const ICONS=ICON_NAMES.map(n=>{ const im=new Image(); im.src='data:image/svg+xml;utf8,'+encodeURIComponent(ICON_SVG[n]); return im; });
const iconsReady=Promise.all(ICONS.map(im=>(im.decode?im.decode():Promise.resolve()).catch(()=>{})));

/* interior points of every letter (so a bubble can really start INSIDE the glyph); m = how big a bubble fits there */
function computeSpots(){
  initPaths(); const c=document.createElement('canvas').getContext('2d'), dirs=[];
  for(let a=0;a<8;a++) dirs.push([Math.cos(a*Math.PI/4),Math.sin(a*Math.PI/4)]);
  return L.map((e,i)=>{ const b=e.getBBox(), p=PATHS.l[i], pts=[];
    for(let x=b.x+4;x<b.x+b.width-4;x+=4) for(let y=b.y+4;y<b.y+b.height-4;y+=4){
      if(!c.isPointInPath(p,x,y)) continue; let m=0;
      for(let r=2;r<=14;r+=2){ if(dirs.every(d=>c.isPointInPath(p,x+d[0]*r,y+d[1]*r))) m=r; else break; }
      if(m>=4) pts.push({x,y,m}); }
    return pts; });
}
function buildG(m,r){
  const R1=rng(11), bokeh=[]; for(let i=0;i<12;i++) bokeh.push({x:R1(),y:R1(),r:60+R1()*120,sp:0.004+R1()*0.008,c:R1()>.5?'182,255,0':'0,214,143',a:0.025+R1()*0.03,ph:R1()*6});
  const R2=rng(12), plank=[]; for(let i=0;i<60;i++) plank.push({x:R2(),y:R2(),s:0.6+R2()*1.6,sp:0.004+R2()*0.012,ph:R2()*6,a:0.12+R2()*0.25,c:R2()>.6?'182,255,0':'255,255,255'});
  return {m,rect:r,bokeh,plank,cxs:r.left+r.width/2,cys:r.top+r.height*0.5};
}
function layout(){
  dpr=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  if(!LOGO){ const bb=birdIn.getBBox(), k=0.58907, bird={x:731.68+k*(bb.x+bb.width/2), y:k*(bb.y+bb.height/2)};
    const lets=L.map(e=>{ const b=e.getBBox(); return {x:b.x+b.width/2,y:b.y+b.height/2,top:b.y,h:b.height}; });
    const spots=computeSpots(); LOGO={bird,lets,spots,events:buildEvents(spots)}; }
  const ctm=svg.getScreenCTM(); G=buildG({a:ctm.a,d:ctm.d,e:ctm.e,f:ctm.f},svg.getBoundingClientRect());
}

/* ───────── shared state (live page and HD recorder both read these) ───────── */
function letterState(i,t){ const ts=TL.L0+i*TL.LSTEP, u=clamp((t-ts)/TL.LDUR); if(u<=0) return null; const p=easeOutCubic(u);
  return {c:LOGO.lets[i],op:p,dy:14*(1-p),sc:0.96+0.04*p,done:u>=1}; }
function birdPose(t,b){ const u=clamp((t-TL.BIRD)/1.2), p=easeOutCubic(u), hov=Math.sin(Math.PI*2*1.1*t)*3*p;
  return {op:clamp(u*1.6),gx:b.x,gy:b.y-60*(1-p)+hov,rot:Math.sin(Math.PI*2*0.5*t)*2*p,wa:(5+10*(1-p))*Math.sin(Math.PI*2*9*t)}; }
const tagP=(t,t0)=>easeOutCubic(clamp((t-t0)/0.6));

function render(t){
  if(!G) layout();
  for(let i=0;i<11;i++){ const e=L[i], st=letterState(i,t);
    if(!st){ e.setAttribute('opacity',0); e.removeAttribute('transform'); continue; }
    e.setAttribute('opacity',st.op.toFixed(3));
    if(st.done) e.removeAttribute('transform');
    else e.setAttribute('transform',`translate(0 ${st.dy.toFixed(2)}) translate(${st.c.x} ${st.c.y}) scale(${st.sc.toFixed(3)}) translate(${-st.c.x} ${-st.c.y})`); }
  { const b=LOGO.bird, p=birdPose(t,b);
    birdFx.setAttribute('opacity',p.op.toFixed(3));
    birdFx.setAttribute('transform',`translate(${p.gx.toFixed(2)} ${p.gy.toFixed(2)}) rotate(${p.rot.toFixed(2)}) translate(${-b.x} ${-b.y})`);
    w1.setAttribute('transform',`rotate(${(-p.wa).toFixed(2)} 235 255)`); w2.setAttribute('transform',`rotate(${(p.wa*1.2).toFixed(2)} 290 200)`); }
  shine.setAttribute('opacity',0);
  [[t1,TL.TAG1],[t2,TL.TAG2]].forEach(([e,t0])=>{ const p=tagP(t,t0); e.style.opacity=p; e.style.transform=`translateY(${(1-p)*12}px)`; e.style.letterSpacing=`${(0.08*(1-p)).toFixed(3)}em`; });
  stage.style.transform='';
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H); drawFX(cx,W,H,t);
}

/* ───────── bubbles ───────── */
function evPos(ev,t){
  const dt=t-ev.t;
  if(ev.kind==='small'){ return {x:ev.x0+ev.A*Math.min(1,dt/0.8)*Math.sin(ev.w*dt+ev.ph), y:ev.y0-ev.vy*dt, r:ev.r0+(ev.R-ev.r0)*easeOutCubic(clamp(dt/0.9)), sx:1, sy:1}; }
  const u=clamp(dt/ev.D), k=ev.k, wob=Math.sin(Math.PI*2*0.5*dt+k)*16*(1-u), idle=Math.max(0,t-ev.tS), sq=Math.exp(-dt/0.14);
  return {x:ev.x0+(ev.tx-ev.x0)*easeInOutSine(u)+wob+Math.sin(Math.PI*2*(0.21*idle+k*0.37))*4*clamp(idle),
          y:ev.y0+(ev.ty-ev.y0)*easeOutCubic(u)+Math.sin(Math.PI*2*(0.33*idle+k*0.21))*6*clamp(idle),
          r:ev.r0+(ev.R-ev.r0)*easeOutBack(clamp(dt/1.1),1.2), sx:1-0.14*sq, sy:1+0.22*sq};
}
function glassBubble(c,x,y,r,al,sx,sy,icon){
  c.save(); c.translate(x,y); c.scale(sx,sy); c.globalAlpha=al;
  const g=c.createRadialGradient(-r*0.25,-r*0.3,r*0.05,0,0,r); g.addColorStop(0,'rgba(255,255,255,.12)'); g.addColorStop(0.55,'rgba(120,255,200,.05)'); g.addColorStop(0.86,'rgba(0,214,143,.16)'); g.addColorStop(0.96,'rgba(150,255,170,.45)'); g.addColorStop(1,'rgba(182,255,0,0)');
  c.fillStyle=g; c.beginPath(); c.arc(0,0,r,0,7); c.fill();
  if(icon!=null&&ICONS[icon].complete&&ICONS[icon].naturalWidth){ c.globalAlpha=al*0.96; c.drawImage(ICONS[icon],-r*0.6,-r*0.6,r*1.2,r*1.2); c.globalAlpha=al; }
  const rg=c.createLinearGradient(-r,-r,r,r); rg.addColorStop(0,'#B6FF00'); rg.addColorStop(1,'#00D68F'); c.strokeStyle=rg; c.lineWidth=Math.max(0.9,r*0.04); c.globalAlpha=al*0.9; c.beginPath(); c.arc(0,0,r*0.985,0,7); c.stroke();
  c.globalAlpha=al; c.lineCap='round'; c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=Math.max(0.9,r*0.07); c.beginPath(); c.arc(0,0,r*0.78,Math.PI*1.12,Math.PI*1.42); c.stroke();
  c.fillStyle='rgba(255,255,255,.75)'; c.beginPath(); c.arc(r*0.52*Math.cos(Math.PI*1.3),r*0.52*Math.sin(Math.PI*1.3)+r*0.02,Math.max(0.7,r*0.045),0,7); c.fill();
  c.strokeStyle='rgba(182,255,0,.4)'; c.lineWidth=Math.max(0.8,r*0.05); c.beginPath(); c.arc(0,0,r*0.8,Math.PI*0.1,Math.PI*0.38); c.stroke();
  c.restore();
}
function insideBubble(c,ev,t){            // a bubble still trapped in the glyph: dark inclusion with a white glint
  const f=clamp((t-ev.tf)/(ev.t-ev.tf)), fade=1-clamp((t-ev.t)/0.22); if(f<=0||fade<=0) return;
  const r=ev.r0*easeOutCubic(f)*(1+0.05*Math.sin(t*9)), al=fade*(ev.kind==='big'?1:0.8);
  c.save(); c.clip(PATHS.l[ev.letter]); c.globalAlpha=al;
  if(ev.kind==='big'){ c.globalCompositeOperation='lighter'; const g=c.createRadialGradient(ev.x0,ev.y0,0,ev.x0,ev.y0,r*4); g.addColorStop(0,`rgba(182,255,0,${0.35*f})`); g.addColorStop(1,'rgba(182,255,0,0)'); c.fillStyle=g; c.beginPath(); c.arc(ev.x0,ev.y0,r*4,0,7); c.fill(); c.globalCompositeOperation='source-over'; }
  c.fillStyle='rgba(13,17,23,.2)'; c.beginPath(); c.arc(ev.x0,ev.y0,r,0,7); c.fill();
  c.strokeStyle='rgba(13,17,23,.55)'; c.lineWidth=1.6; c.beginPath(); c.arc(ev.x0,ev.y0,r,0,7); c.stroke();
  c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=Math.max(1,r*0.16); c.lineCap='round'; c.beginPath(); c.arc(ev.x0,ev.y0,r*0.62,Math.PI*1.15,Math.PI*1.45); c.stroke();
  const u=clamp((t-ev.t)/0.6); if(u>0&&u<1){ c.globalAlpha=(1-u)*0.5; c.strokeStyle='rgba(0,150,100,1)'; c.lineWidth=1.4; c.beginPath(); c.arc(ev.x0,ev.y0,ev.r0*1.2+u*36,0,7); c.stroke(); }
  c.restore();
}
function drawFX(c,W,H,t){
  const m=G.m, sc=W/1920+0.25;
  // calm atmosphere: soft bokeh, slow plankton, a gently breathing glow behind the logo
  c.save(); c.globalCompositeOperation='lighter';
  G.bokeh.forEach(b=>{ const x=((b.x+Math.sin(t*0.12+b.ph)*0.03)%1)*W, y=(((b.y-b.sp*t)%1+1)%1)*H, r=b.r*sc, g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${b.c},${b.a})`); g.addColorStop(1,`rgba(${b.c},0)`); c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); });
  const br=0.05+0.03*Math.sin(Math.PI*2*t/5.2), bg=c.createRadialGradient(G.cxs,G.cys,0,G.cxs,G.cys,G.rect.width*0.6); bg.addColorStop(0,`rgba(0,214,143,${br*clamp(t/2)})`); bg.addColorStop(1,'rgba(0,214,143,0)'); c.fillStyle=bg; c.fillRect(0,0,W,H);
  c.restore();
  G.plank.forEach(p=>{ const x=(p.x+Math.sin(t*0.3+p.ph)*0.01)*W, y=(((p.y-p.sp*t)%1+1)%1)*H; c.globalAlpha=p.a*(0.6+0.4*Math.sin(t*1.3+p.ph))*clamp(t/1.5); c.fillStyle=`rgb(${p.c})`; c.beginPath(); c.arc(x,y,p.s*sc,0,7); c.fill(); }); c.globalAlpha=1;
  // everything below lives in logo units
  c.save(); c.translate(m.e,m.f); c.scale(m.a,m.d); c.translate(OFFX,0); initPaths();
  const ev=LOGO.events;
  ev.forEach(e=>{ if(t>=e.tf&&t<=e.t+0.3) insideBubble(c,e,t); });
  ev.forEach(e=>{ if(e.kind!=='small'||t<e.t) return; const dt=t-e.t, end=e.life;
    if(dt>end+0.45) return; const p=evPos(e,t);
    if(dt>=end){ if(!e.pop) return; const u=clamp((dt-end)/0.4); if(u>=1) return; c.globalAlpha=(1-u)*0.8; c.strokeStyle='#B6FF00'; c.lineWidth=1.3; c.beginPath(); c.arc(p.x,p.y,e.R*(1+0.9*easeOutCubic(u)),0,7); c.stroke();
      for(let j=0;j<6;j++){ const a=j*Math.PI/3+e.ph, d=e.R*(1+1.6*easeOutCubic(u)); c.fillStyle='rgba(182,255,0,.9)'; c.beginPath(); c.arc(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,1.5*(1-u),0,7); c.fill(); } c.globalAlpha=1; return; }
    const fadeIn=clamp(dt/0.25)*clamp(dt/0.2), fadeOut=e.pop?1:1-clamp((dt-(end-1.4))/1.4);
    glassBubble(c,p.x,p.y,p.r,0.75*fadeIn*fadeOut,p.sx,p.sy,null); });
  ev.forEach(e=>{ if(e.kind!=='big'||t<e.t) return; const p=evPos(e,t), a=clamp((t-e.t)/0.25); glassBubble(c,p.x,p.y,p.r,a,p.sx,p.sy,e.k);
    const la=clamp((t-e.tS-0.2)/0.8); if(la>0){ c.save(); c.globalAlpha=la*0.92; c.fillStyle='#C9D1DC'; c.font='500 30px Inter, system-ui, sans-serif'; c.textAlign='center'; c.textBaseline='middle'; const ln=ICON_LABEL[e.k];
      ln.forEach((s,i)=>c.fillText(s,e.tx,e.ty+e.R+44+i*36+(1-easeOutCubic(la))*8)); c.restore(); } });

const tut=$('tut'), fin=$('fin'), cap=$('cap'), stepb=$('stepb'), vp=$('vp'), cam=$('cam'), imA=$('imA'), imB=$('imB'), spot=$('spot'), kb=$('kb'), tagx=$('tagx'), cur=$('cur2'), ovTitle=$('ovTitle');

let ctx=null,bus=null,T0=0,raf=0,muted=false,fallbackStart=0,token=0,started=false,voiceName='',VOICES=[];
const startEl=$('start');
function nowT(){ if(ctx){ return ctx.currentTime-T0-(ctx.outputLatency||ctx.baseLatency||0); } return (performance.now()-fallbackStart)/1000; }

/* ── voice: the browser's own English voices ── */
function populateVoices(){
  if(!('speechSynthesis' in window)) return;
  VOICES=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const sel=$('vsel');
  sel.innerHTML=VOICES.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}">${v.name.replace(/^Microsoft |^Google /,'').replace(/ Online \(Natural\)/,' (Natural)')}</option>`).join('')+'<option value="">Voice off (captions)</option>';
  if(!voiceName||!VOICES.some(v=>v.name===voiceName)){ const pref=VOICES.find(v=>/natural/i.test(v.name)&&/en-US/i.test(v.lang))||VOICES.find(v=>/natural/i.test(v.name))||VOICES.find(v=>/google us english/i.test(v.name))||VOICES.find(v=>/aria|jenny|samantha|zira|daniel/i.test(v.name))||VOICES[0]; voiceName=pref?pref.name:''; }
  sel.value=voiceName; syncCaps();
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=function(){ try{populateVoices();}catch(e){console.error(e);} }; try{ populateVoices(); }catch(e){ console.error(e); } }
function syncCaps(){ const on=!voiceName||capOn; cap.classList.toggle('off',!on); $('cc').classList.toggle('on',on); $('cc').setAttribute('aria-pressed',on); }
var capOn=false;
$('vsel').addEventListener('change',e=>{ voiceName=e.target.value; syncCaps(); if(started) play(); });
function speak(text){
  const est=Math.max(2200,text.split(/\s+/).length*390+600);
  return new Promise(res=>{
    const v=VOICES.find(x=>x.name===voiceName);
    if(!v||!('speechSynthesis' in window)){ setTimeout(res,est); return; }
    let done=false, tm=0; const end=()=>{ if(done) return; done=true; clearTimeout(tm); duck(false); res(); };
    const u=new SpeechSynthesisUtterance(text); u.voice=v; u.lang=v.lang; u.rate=1; u.volume=muted?0:1; u.onend=end; u.onerror=end;
    tm=setTimeout(end,est*2.4+1500); duck(true); speechSynthesis.speak(u);
  });
}

let NBUF=null;
function sfx(kind){ try{ sfx0(kind); }catch(e){ console.error(e); } }
function sfx0(kind){
  if(!ctx||!bus) return; const t=ctx.currentTime+0.01;
  const g=ctx.createGain(), p=ctx.createStereoPanner(), s=ctx.createGain(); s.gain.value=0.22; p.pan.value=0;
  g.connect(p); p.connect(bus.dry); g.connect(s); s.connect(bus.rev);
  const env=(a,pk,d)=>{ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(pk,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); };
  const osc=(type,f0,f1,dur)=>{ const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur); o.connect(g); o.start(t); o.stop(t+dur+0.1); return o; };
  if(kind==='click'){ env(.004,.09,.07); osc('triangle',1500,650,.07); }
  else if(kind==='tick'){ env(.003,.05,.05); osc('sine',1900,1500,.05); }
  else if(kind==='drop'){ env(.006,.16,.2); osc('sine',210,80,.18); }
  else if(kind==='chime'){ env(.01,.07,.7); osc('sine',880,0,.7); const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=1318.5; o.connect(g); o.start(t+.08); o.stop(t+.8); }
  else if(kind==='whoosh'){ if(!NBUF) NBUF=noiseBuf(ctx,1); const n=ctx.createBufferSource(); n.buffer=NBUF; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.1;
    f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(3200,t+.38); env(.12,.07,.3); n.connect(f); f.connect(g); n.start(t); n.stop(t+.6); }
}

/* ── music: soft generative loop (C – G – Am – F), ducks under the voice ── */
let mG=null, mTimer=0, mNext=0, mBar=0;
const CH=[[130.81,164.81,196],[98,123.47,146.83],[110,130.81,164.81],[87.31,110,130.81]], BAR=2.5, EIGHTH=BAR/8;
function startMusic(){
  if(!ctx||!bus) return; stopMusic(true);
  mG=ctx.createGain(); mG.gain.value=0.0001; mG.connect(bus.dry); const rs=ctx.createGain(); rs.gain.value=0.35; mG.connect(rs); rs.connect(bus.rev);
  mG.gain.setTargetAtTime(0.5,ctx.currentTime,0.8); mNext=ctx.currentTime+0.1; mBar=0;
  const pump=()=>{ while(mNext<ctx.currentTime+1.6){ bar(mNext,mBar++); mNext+=BAR; } }; pump(); mTimer=setInterval(pump,400);
}
function stopMusic(now){ clearInterval(mTimer); if(mG&&ctx){ const g=mG; g.gain.cancelScheduledValues(ctx.currentTime); g.gain.setTargetAtTime(0.0001,ctx.currentTime,now?0.02:0.6); setTimeout(()=>{ try{g.disconnect();}catch(e){} },now?100:3500); } mG=null; }
function duck(on){ if(mG&&ctx) mG.gain.setTargetAtTime(on?0.22:0.5,ctx.currentTime,0.2); }
function note(f,t,dur,type,pk,pan){ const o=ctx.createOscillator(), g=ctx.createGain(), p=ctx.createStereoPanner(); o.type=type; o.frequency.value=f; p.pan.value=pan||0;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(pk,t+(type==='triangle'&&dur>1?0.5:0.01)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(p); p.connect(mG); o.start(t); o.stop(t+dur+0.05); }
function bar(t,i){
  const c=CH[i%4];
  c.forEach((f,k)=>note(f*2,t,BAR+0.4,'triangle',0.022,(k-1)*0.35));            // pad
  note(c[0],t,0.9,'sine',0.085,0); note(c[0],t+BAR/2,0.7,'sine',0.06,0);        // bass
  const pat=[0,1,2,1,2,1,0,2];
  for(let k=0;k<8;k++){ if((k*5+i*3)%7===0) continue; note(c[pat[k]]*4,t+k*EIGHTH,0.5,'sine',0.026,(k%2?0.3:-0.3)); } // airy pluck
}


/* ── camera, cursor, spotlight (all in screenshot pixels) ── */
const IW=D.iw, IH=D.ih;
const C={cx:IW/2,cy:IH/2,z:1}, CT={cx:IW/2,cy:IH/2,z:1};
const P={x:IW*.6,y:IH*.9,fx:0,fy:0,tx:0,ty:0,t0:0,dur:1,vis:false};
let HL=null, TG=null, VW=1, VH=1, base=1, lastF=0, camRaf=0;
function measure(){ const r=vp.getBoundingClientRect(); VW=r.width||1; VH=r.height||1; base=VW/IW; cam.style.width=IW+'px'; cam.style.height=IH+'px'; }
function camTo(r){ let z=1,cx=IW/2,cy=IH/2; if(r){ z=Math.min(IW/r[2],IH/r[3]); z=Math.max(1,Math.min(z,4)); cx=r[0]+r[2]/2; cy=r[1]+r[3]/2; }
  const hw=IW/(2*z), hh=IH/(2*z); CT.cx=Math.max(hw,Math.min(IW-hw,cx)); CT.cy=Math.max(hh,Math.min(IH-hh,cy)); CT.z=z; }
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function scr(x,y){ const s=base*C.z; return [(x-C.cx)*s+VW/2,(y-C.cy)*s+VH/2]; }
function frame(now){
  const dt=Math.min(.05,(now-(lastF||now))/1000); lastF=now; const k=1-Math.exp(-dt*3.6);
  C.cx+=(CT.cx-C.cx)*k; C.cy+=(CT.cy-C.cy)*k; C.z+=(CT.z-C.z)*k;
  const s=base*C.z; cam.style.transform=`translate(${(VW/2-C.cx*s).toFixed(2)}px,${(VH/2-C.cy*s).toFixed(2)}px) scale(${s.toFixed(5)})`;
  const u=Math.min(1,(now-P.t0)/P.dur), e=ease(u); P.x=P.fx+(P.tx-P.fx)*e; P.y=P.fy+(P.ty-P.fy)*e;
  const [px,py]=scr(P.x,P.y); cur.style.transform=`translate(${(px-3).toFixed(1)}px,${(py-2).toFixed(1)}px)`;
  if(HL){ const [x1,y1]=scr(HL[0],HL[1]), [x2,y2]=scr(HL[0]+HL[2],HL[1]+HL[3]); spot.style.transform=`translate(${x1.toFixed(1)}px,${y1.toFixed(1)}px)`; spot.style.width=(x2-x1)+'px'; spot.style.height=(y2-y1)+'px'; }
  if(TG){ const [x,y]=scr(TG.x,TG.y); tagx.style.left=x+'px'; tagx.style.top=y+'px'; }
  camRaf=requestAnimationFrame(frame);
}
function moveCur(p,ms){ P.fx=P.x; P.fy=P.y; P.tx=p[0]; P.ty=p[1]; P.t0=performance.now(); P.dur=ms; if(!P.vis){ P.vis=true; cur.style.opacity=1; } }
let shown='';
function showImg(id){ if(!id||id===shown) return; const a=imA.style.opacity!=='0'?imA:imB, b=a===imA?imB:imA; b.src=D.shots[id]; b.style.opacity=1; a.style.opacity=0; shown=id; }
function setSpot(r){ HL=r||null; spot.classList.toggle('on',!!r); }
function setTag(t){ if(!t){ TG=null; tagx.classList.remove('on'); return; } TG={x:t[0],y:t[1]}; tagx.textContent=t[2]; tagx.style.translate=t[3]||'-50% -130%'; tagx.classList.add('on'); }
function setKey(k){ if(!k){ kb.classList.remove('on'); return; } kb.innerHTML=(k.label||'Press')+' '+k.keys.map(x=>`<kbd>${x}</kbd>`).join(' + '); kb.classList.add('on'); setTimeout(()=>kb.querySelectorAll('kbd').forEach(e=>e.classList.add('press')),260); sfx('tick'); }

/* ── one beat: picture, camera, highlight, cursor, click ── */
async function beat(b,W,i){
  if(b.img) showImg(b.img);
  if('cam' in b) camTo(b.cam);
  if('hl' in b) setSpot(b.hl);
  if('tag' in b) setTag(b.tag);
  if('key' in b) setKey(b.key);
  if(b.zoomsfx) sfx('whoosh');
  if(b.cur){ moveCur(b.cur,b.mv||820); await W((b.mv||820)+60); }
  if(b.click){ cur.classList.remove('click'); void cur.offsetWidth; cur.classList.add('click'); sfx('click'); await W(260); }
  if(b.sfx) sfx(b.sfx);
  await W(b.hold==null?900:b.hold);
}
function setStep(n,txt){ stepb.innerHTML=n?`<span class="n">${n}</span><span>${txt}</span>`:''; stepb.classList.toggle('on',!!n); }
function showCap(t){ cap.textContent=t; cap.classList.add('show'); }

async function runScene(s,W){
  if(s.kind==='title'||s.kind==='outro'){
    setStep(0); showCap(s.say);
    const act=(async()=>{ if(s.kind==='outro'){ fin.classList.remove('pageon'); cur.style.opacity=0; P.vis=false; setSpot(null); setKey(null); setTag(null); await W(500); }
      ovTitle.classList.add('on'); await W(220); ovTitle.classList.add('pop'); sfx('whoosh');
      for(const c of ovTitle.querySelectorAll('.chips2 span')){ await W(s.kind==='outro'?120:560); c.classList.add('on'); sfx('tick'); }
      await W(s.kind==='outro'?1800:900); })();
    await Promise.all([speak(s.say),act]);
    if(s.kind==='title'){ ovTitle.classList.remove('on','pop'); await W(400); fin.classList.add('pageon'); }
    cap.classList.remove('show'); await W(200); return;
  }
  if(s.step) setStep(s.step[0],s.step[1]); else setStep(0);
  showCap(s.say);
  const act=(async()=>{ for(const b of s.beats) await beat(b,W); })();
  await Promise.all([speak(s.say),act]);
  cap.classList.remove('show'); setKey(null); setTag(null); await W(260);
}
const W0=my=>ms=>new Promise((res,rej)=>setTimeout(()=>my===token?res():rej('x'),ms));
function resetUI(){
  fin.className='fin'; ovTitle.className='ov'; ovTitle.querySelectorAll('.chips2 span').forEach(s=>s.classList.remove('on'));
  shown=''; imA.style.opacity=1; imB.style.opacity=0; imA.src=D.shots[D.first]; shown=D.first;
  measure(); camTo(null); Object.assign(C,CT); setSpot(null); setKey(null); setTag(null); cur.style.opacity=0; P.vis=false; P.x=P.tx=IW*.62; P.y=P.ty=IH*.95;
  setStep(0); cap.classList.remove('show');
  cancelAnimationFrame(camRaf); lastF=0; camRaf=requestAnimationFrame(frame);
}
async function runTutorial(from){
  const my=++token; const W=W0(my);
  resetUI(); tut.classList.add('on'); startMusic();
  try{ for(let i=from||0;i<D.scenes.length;i++){ if(from&&i===from&&D.scenes[i].kind!=='title') fin.classList.add('pageon'); await runScene(D.scenes[i],W); window.fwScene=i; } await finish(my); }
  catch(e){ if(e!=='x') console.error(e); }
}
async function finish(my){
  tut.classList.remove('on'); stopMusic(); await new Promise(r=>setTimeout(r,500)); if(my!==token) return;
  cancelAnimationFrame(camRaf);
  stage.classList.remove('gone'); $('fx').classList.remove('gone'); render(TL.END); $('replay').hidden=false; window.fwDone=true;
  if(window.parent!==window){ setTimeout(()=>{ if(my===token) parent.postMessage({type:'fw-tutorial-end'},'*'); },1600); } else $('replay').focus();
}

/* ── start / replay ── */
function loop(){ const t=nowT(); render(t); if(t<TL.SHOW+0.7) raf=requestAnimationFrame(loop); else toTutorial(); }
function toTutorial(){ stage.classList.add('gone'); $('fx').classList.add('gone'); runTutorial(0); }

function fwTapSound(play){ if(!/[?&]autoplay=1/.test(location.search)||document.getElementById('fwtap')) return;
  const b=document.createElement('button'); b.id='fwtap'; b.type='button'; b.textContent='🔊 Tap for sound';
  b.style.cssText='position:fixed;z-index:99;top:12px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:999px;border:1px solid rgba(182,255,0,.5);background:rgba(13,17,23,.88);color:#B6FF00;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent';
  b.addEventListener('click',function(){ b.remove(); play(); }); document.body.appendChild(b); }
function fwPrime(){ try{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch(_){}
  try{ if(typeof REC!=='undefined'&&typeof voiceName==='string'&&voiceName.indexOf('rec-')===0){ const k=voiceName.slice(4); window.__fwPrimed=window.__fwPrimed||{}; if(REC[k]){ const a=new Audio(REC[k].src); a.muted=true; window.__fwPrimed[k]=a; const p=a.play(); if(p) p.then(function(){ a.pause(); a.currentTime=0; }).catch(function(){}); } } }catch(_){} }
async function play(){
  started=true; token++; cancelAnimationFrame(raf); stopMusic(true); if('speechSynthesis' in window) speechSynthesis.cancel(); try{fwPrime();}catch(_){}
  startEl.classList.add('hide'); $('replay').hidden=true; tut.classList.remove('on'); stage.classList.remove('gone'); $('fx').classList.remove('gone'); window.fwDone=false;
  try{ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; ctx=new AC(); bus=buildBus(ctx); bus.master.gain.value=muted?0:0.9; }
    await Promise.race([ctx.resume(),new Promise(function(r){setTimeout(r,350)})]); if(ctx.state!=='running') throw 0; T0=ctx.currentTime+0.15; scheduleAudio(ctx,bus,T0);
  }catch(e){ ctx=null; bus=null; fallbackStart=performance.now()+150; try{fwTapSound(play);}catch(_){} }
  render(-1); loop();
}
startEl.addEventListener('click',play);
$('replay').addEventListener('click',play);
$('cc').addEventListener('click',()=>{ capOn=!capOn; syncCaps(); });
$('mute').addEventListener('click',()=>{ muted=!muted; if(bus) bus.master.gain.value=muted?0:0.9; if(muted&&'speechSynthesis' in window) speechSynthesis.cancel();
  $('mute').setAttribute('aria-pressed',muted); $('muteLbl').textContent=muted?'Sound off':'Sound on';
  $('muteIcon').innerHTML=muted?'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>':'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'; });
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ layout(); measure(); if(!started) render(-1); },80); });
window.fwSkip=from=>{ started=true; startEl.classList.add('hide'); stage.classList.add('gone'); $('fx').classList.add('gone'); runTutorial(from||0); };

layout(); render(-1); syncCaps();
addEventListener('message',e=>{ if(!(e.data&&e.data.type==='fw-fade')) return; const ms=e.data.ms||1000; token++; if('speechSynthesis' in window) speechSynthesis.cancel();
  if(ctx&&bus) bus.master.gain.setTargetAtTime(0,ctx.currentTime,ms/3000); });
if(/[?&]autoplay=1/.test(location.search)){ startEl.classList.add('hide'); (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(play,150)); }

})();
</script>
